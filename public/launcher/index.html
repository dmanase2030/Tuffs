<script>
/* ===== Tuffs launcher: accounts, proxy browser, game catalog =====
 * Accounts use the same /api/auth/* endpoints and the same 'lumio_session'
 * localStorage entry ({u,t} bearer token) as the main Tuffs site, so signing
 * in here also signs you in there and vice versa. */
let AUTH={mode:'out',name:'',admin:false},SESSION=null,PENDING=null,AMODE='in';
try{SESSION=JSON.parse(localStorage.getItem('lumio_session')||'null')}catch(e){SESSION=null}
const PROXY='/service/',SEARCH='https://www.bing.com/search?q=';
const QUICK=[['Google','https://www.google.com'],['YouTube','https://www.youtube.com'],['Wikipedia','https://www.wikipedia.org'],['Reddit','https://www.reddit.com']];
const USER_RE=/^[\w.-]{3,20}$/;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
function initial(){return ((AUTH.name||'Guest')[0]||'?').toUpperCase()}
function saveSession(u,t){SESSION={u,t};try{localStorage.setItem('lumio_session',JSON.stringify(SESSION))}catch(e){}}
function clearSession(){SESSION=null;try{localStorage.removeItem('lumio_session')}catch(e){}}
async function authPost(path,body){try{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json',...(SESSION?{authorization:'Bearer '+SESSION.t}:{})},body:JSON.stringify(body||{})});const d=await r.json().catch(()=>({}));if(!r.ok)return{error:d.error||('Request failed ('+r.status+')'),status:r.status};return d}catch(e){return{error:'Network error. Try again.'}}}
function paintUser(){const n=AUTH.mode=='out'?'':AUTH.name,i=AUTH.mode=='out'?'?':initial();
 $('#lav').textContent=i;$('#lname').textContent=n;
 const ca=$('#ccav');if(ca){ca.textContent=i;$('#ccname').textContent=n||'Not signed in';$('#ccsub').textContent=AUTH.mode=='user'?(AUTH.admin?'Tuffs account · admin':'Tuffs account'):'Guest, nothing is saved to an account';const so=$('#cc [data-so]');if(so)so.textContent=AUTH.mode=='user'?'Sign out':'Sign in'}
 if(typeof repaintSettings=='function'&&document.querySelector('.stw'))repaintSettings();
 document.querySelectorAll('[data-acct]').forEach(b=>lumioAccount(b))}
function setAMode(m){AMODE=m;document.querySelectorAll('#af .seg2 button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));$('#ac').hidden=m=='in';$('#ap').autocomplete=m=='in'?'current-password':'new-password';$('#ago').textContent=m=='in'?'Sign in':'Create account';$('#ae').textContent=''}
function showLock(msg){const L=$('#lock');L.classList.remove('off');const out=AUTH.mode=='out';$('#af').hidden=!out;$('#lin').hidden=out;
 if(out){$('#ap').value='';$('#ac').value='';if(!$('#au').value&&SESSION&&SESSION.u)$('#au').value=SESSION.u;$('#ae').textContent=msg||''}
 else $('#lhint').textContent=msg||'Tap or press any key to unlock';
 $('#lso').textContent=AUTH.mode=='guest'?'Sign in to an account':'Not you? Sign out';paintUser()}
function lockNow(){document.querySelectorAll('.cm').forEach(m=>m.remove());showLock()}
function unlock(){if(AUTH.mode=='out')return;$('#lock').classList.add('off');if(PENDING){const h=PENDING;PENDING=null;open(h)}}
function signedIn(d,unlockNow){saveSession(d.username,d.token);AUTH={mode:'user',name:d.username,admin:!!d.isAdmin};try{sessionStorage.removeItem('lumio_guest')}catch(e){}paintUser();if(unlockNow)unlock()}
function closeAll(){document.querySelectorAll('.win').forEach(w=>{w.onclose&&w.onclose();w.remove()});for(const k in open_)delete open_[k];dockUpd();fgName(null)}
async function signOut(){if(AUTH.mode=='user'&&SESSION)authPost('/api/auth/logout',{});clearSession();try{sessionStorage.removeItem('lumio_guest')}catch(e){}
 AUTH={mode:'out',name:'',admin:false};closeAll();setAMode('in');$('#au').value='';showLock()}
async function bootAuth(){
 const f=$('#af');setAMode('in');
 f.querySelectorAll('.seg2 button').forEach(b=>b.onclick=()=>setAMode(b.dataset.m));
 $('#lso').onclick=e=>{e.stopPropagation();signOut()};
 $('#agu').onclick=()=>{AUTH={mode:'guest',name:'Guest',admin:false};try{sessionStorage.setItem('lumio_guest','1')}catch(e){}paintUser();unlock()};
 let busy=false;
 f.onsubmit=async e=>{e.preventDefault();if(busy)return;const u=$('#au').value.trim(),p=$('#ap').value,er=$('#ae');er.textContent='';
  if(!u||!p){er.textContent='Enter your username and password.';return}
  if(AMODE=='up'){if(!USER_RE.test(u)){er.textContent='Username must be 3–20 letters, numbers, dots, _ or -';return}if(p.length<4){er.textContent='Password must be at least 4 characters';return}if(p!==$('#ac').value){er.textContent='Passwords do not match';return}}
  busy=true;const go=$('#ago'),lab=go.textContent;go.disabled=true;go.textContent=AMODE=='in'?'Signing in…':'Creating account…';
  try{const d=await authPost(AMODE=='in'?'/api/auth/login':'/api/auth/signup',{username:u,password:p});
   if(d.error)er.textContent=d.error;else{try{if(window.PasswordCredential&&navigator.credentials)navigator.credentials.store(new PasswordCredential({id:u,password:p})).catch(()=>{})}catch(_){}signedIn(d,true);toast(AMODE=='in'?'Welcome back, '+d.username:'Account created. Welcome, '+d.username)}}
  finally{busy=false;go.disabled=false;go.textContent=lab}};
 let guest=false;try{guest=sessionStorage.getItem('lumio_guest')=='1'}catch(e){}
 if(SESSION&&SESSION.t){AUTH={mode:'user',name:SESSION.u||'',admin:false};showLock('Checking your account…');
  try{const r=await fetch('/api/auth/me',{headers:{authorization:'Bearer '+SESSION.t}});const d=await r.json().catch(()=>({}));
   if(r.ok){AUTH={mode:'user',name:d.username,admin:!!d.isAdmin};SESSION.u=d.username;saveSession(d.username,SESSION.t);showLock()}
   else if(r.status==401){clearSession();AUTH={mode:'out',name:'',admin:false};showLock('You were signed out. Sign in again.')}
   else{AUTH={mode:'out',name:'',admin:false};showLock(d.error||'Accounts are unavailable right now. Try again soon.')}}
  catch(e){showLock('Offline. Tap to unlock with your saved sign-in.')}}
 else if(guest){AUTH={mode:'guest',name:'Guest',admin:false};showLock()}
 else showLock()}

/* ---- Account app ---- */
function lumioAccount(b){b.dataset.acct=1;const u=AUTH.mode=='user';
 b.innerHTML=`<div class=pad style="text-align:center"><div class="acc acav">${esc(initial())}</div><b style="font-size:16px">${esc(AUTH.name||'Guest')}</b><p style="font-size:12px;opacity:.75;margin-top:6px;line-height:1.5">${u?(AUTH.admin?'Signed in to your Tuffs account (admin).':'Signed in to your Tuffs account. It works on the main Tuffs site too.'):'You are using Lumio as a guest. Your settings stay in this browser only.'}</p><div class=row style="justify-content:center;margin-top:14px;flex-wrap:wrap"><button class=btn data-lock>Lock screen</button><button class="btn ${u?'':'acc'}" data-out>${u?'Sign out':'Sign in or create account'}</button></div></div>`;
 b.querySelector('[data-lock]').onclick=()=>lockNow();b.querySelector('[data-out]').onclick=()=>signOut()}

/* ---- Browser app: pages load through the site's /service/ proxy ---- */
function parseAddr(v){v=(v||'').trim();if(!v)return null;if(/^https?:\/\//i.test(v))return v;if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(v))return 'https://'+v;return SEARCH+encodeURIComponent(v)}
/* /service/https:/host/path keeps the site's own path, so relative links resolve inside the proxy */
function proxify(u){if(/^\s*(javascript|data|vbscript):/i.test(u))return 'about:blank';return /^https?:\/\//i.test(u)?PROXY+u.replace(/^(https?):\/\//i,'$1:/'):u}
function unproxy(path){if(path.indexOf(PROXY)!==0)return null;const raw=path.slice(PROXY.length),m=raw.match(/^(https?):\/+(.*)$/i);if(m)return m[1]+'://'+m[2];try{return decodeURIComponent(raw)}catch(e){return null}}
/* Register the proxy's service worker early so the first page already loads fully. */
try{if(navigator.serviceWorker&&isSecureContext)navigator.serviceWorker.register('/service/__sw.js',{scope:'/service/'}).catch(()=>{})}catch(e){}
function newTab(u){const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove()}
function lumioBrowser(b){
 b.innerHTML=`<div class=lb><div class=lbt><button class=lbb data-b=back aria-label=Back>${ic('<path d="M15 5l-7 7 7 7"/>')}</button><button class=lbb data-b=fwd aria-label=Forward>${ic('<path d="M9 5l7 7-7 7"/>')}</button><button class=lbb data-b=re aria-label=Reload>${ic('<path d="M20 12a8 8 0 11-2.3-5.6M20 4v5h-5"/>')}</button><form class=lbf><input name=q placeholder="Search or enter address" autocapitalize=none spellcheck=false enterkeyhint=go aria-label="Address"></form><button class=lbb data-b=ext aria-label="Open in new tab">${ic('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>')}</button></div>
 <div class=lbh><div class=lbg>${IC.globe}</div><p class=lbs>Search with Bing or type an address. Pages load through the Tuffs proxy.</p><div class=lbq>${QUICK.map(q=>`<button class=btn data-u="${esc(q[1])}">${esc(q[0])}</button>`).join('')}</div><p class=lbn>Simple sites work best. Logins, videos and heavy apps often don't load through this proxy.</p></div>
 <div class="lbh lbx" hidden></div><iframe class=lbi hidden allow="fullscreen;autoplay;clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-pointer-lock allow-presentation"></iframe></div>`;
 const fr=$('.lbi',b),home=$('.lbh',b),fail=$('.lbx',b),inp=$('input',b);let url='';
 const showFail=()=>{fr.hidden=true;fail.hidden=false;fail.innerHTML=`<b style="display:block;margin-bottom:8px">Couldn't load that page.</b><p class=lbs>The proxy couldn't open it. Some sites block proxies.</p>`};
 const nav=v=>{const u=parseAddr(v);if(!u)return;url=u;inp.value=u;home.hidden=true;fail.hidden=true;fr.hidden=false;const src=proxify(u);fr.src=src;
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);fetch(src,{signal:ctl.signal,method:'GET'}).then(r=>{clearTimeout(tm);if(!r.ok&&url===u)showFail()}).catch(()=>{clearTimeout(tm)})};
 fr.onload=()=>{try{const l=fr.contentWindow.location,real=unproxy(l.pathname);if(real){url=real+(/^https?%3A/i.test(l.pathname.slice(PROXY.length))&&real.indexOf('?')>=0?'':l.search);if(document.activeElement!==inp)inp.value=url}}catch(e){}};

 $('.lbf',b).onsubmit=e=>{e.preventDefault();inp.blur();nav(inp.value)};

 b.onclick=e=>{const q=e.target.closest('[data-u]');if(q){nav(q.dataset.u);return}const t=e.target.closest('[data-b]');if(!t)return;const a=t.dataset.b;
  try{if(a=='back'){if(fr.hidden)return;fr.contentWindow.history.back()}else if(a=='fwd')fr.contentWindow.history.forward();else if(a=='re'){if(url)nav(url)}else if(a=='ext'){if(url)newTab(proxify(url))}}catch(_){}};

/* ---- Games app: the real Tuffs catalog (public/data/games.json + admin overrides from /api/games) ---- */

addEventListener('pointerup',()=>{if(!dg)return;if(dg.m){const t=dg.t,l=Math.max(16,Math.round((t.offsetLeft-16)/GX)*GX+16),tp=Math.max(46,Math.round((t.offsetTop-46)/GY)*GY+46);t.style.left=l+'px';t.style.top=tp+'px';st.pos[t.dataset.a]=[l,tp];save();dragged=1;setTimeout(()=>dragged=0,60)}dg=null});
const cm=()=>document.querySelectorAll('.cm').forEach(m=>m.remove());
function menu(t,x,y){cm();const id=t.dataset.a,m=H(`<div class=cm><button data-o>Open ${APPS[id].n}</button><button data-h>${st.desk.includes(id)?'Remove from Desktop':'Add to Desktop'}</button></div>`);
m.style.left=Math.max(8,Math.min(x,innerWidth-210))+'px';m.style.top=Math.max(8,y>innerHeight/2?y-96:y)+'px';document.body.append(m);
$('[data-o]',m).onclick=()=>{cm();open(id)};$('[data-h]',m).onclick=()=>{cm();pin(id)}}
function pin(id){const had=st.desk.includes(id);st.desk=had?st.desk.filter(k=>k!=id):[...st.desk,id];save();renderSide();toast(st.chrome=='dock'&&!had?'Added. Set Chrome to Desktop in Settings to see it':APPS[id].n+(had?' removed from Desktop':' added to Desktop'))}
document.addEventListener('pointerdown',e=>{if(e.target.closest('.cm'))return;cm();lpFired=0;const t=e.target.closest('[data-a]');if(!t)return;sx=e.clientX;sy=e.clientY;clearTimeout(lp);lp=setTimeout(()=>{if(!dg||!dg.m){lpFired=1;menu(t,sx,sy)}},500)});
document.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>10)clearTimeout(lp)});
['pointerup','pointercancel'].forEach(v=>document.addEventListener(v,()=>clearTimeout(lp)));
document.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-a]');if(t){e.preventDefault();clearTimeout(lp);lpFired=1;menu(t,e.clientX,e.clientY)}});
const ACTS=[['Lock screen',()=>lockNow()],['Sign out',()=>signOut()],['Next wallpaper',()=>{const i=WALLS.findIndex(w=>w[0]==st.wall);st.wall=WALLS[(i+1)%WALLS.length][0];save();applyStyle()}],['Toggle desktop icons',()=>{st.chrome=st.chrome=='dock'?'desktop':'dock';save();applyStyle()}]];
function spR(q){q=q.toLowerCase();$('#spr').innerHTML=vis.filter(k=>APPS[k].n.toLowerCase().includes(q)).map(k=>`<button class=it data-sa=${k}>${APPS[k].i} ${APPS[k].n}</button>`).join('')+ACTS.map((x,i)=>x[0].toLowerCase().includes(q)?`<button class=it data-act=${i}>${IC.gear} ${x[0]}</button>`:'').join('')}
function spOpen(){if(!$('#lock').classList.contains('off'))return;$('#sp').classList.add('on');const i=$('#spq');i.value='';spR('');i.focus()}
$('#spq').oninput=e=>spR(e.target.value);
$('#sp').onclick=e=>{const t=e.target.closest('[data-sa],[data-act]');if(t){$('#sp').classList.remove('on');t.dataset.sa?open(t.dataset.sa):ACTS[+t.dataset.act][1]()}else if(e.target.id=='sp')$('#sp').classList.remove('on')};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();spOpen()}else if(e.key=='Escape'){$('#sp').classList.remove('on');$('#cc').classList.remove('on')}else if(e.key=='Enter'&&$('#sp').classList.contains('on')){const f=$('#spr .it');f&&f.click()}});
document.addEventListener('click',e=>{if(!e.target.closest('#cc,#bcc'))$('#cc').classList.remove('on');if(e.target.closest('[data-sp]')){spOpen();return}if(e.target.closest('#bcc')){$('#cc').classList.toggle('on');return}if(lpFired||dragged){lpFired=0;return}const t=e.target.closest('[data-a]');if(t)open(t.dataset.a)});
$('#wn').value=st.note||'';$('#wn').oninput=e=>{st.note=e.target.value;save()};
renderSide();applyStyle();tick();setInterval(tick,10000);
const route=()=>{const h=location.hash.slice(1);if(Object.keys(APPS).includes(h)&&!APPS[h].hide){if(AUTH.mode!='out'&&$('#lock').classList.contains('off'))open(h);else PENDING=h}};
route();addEventListener('hashchange',route);
bootAuth();
</script><script>
/* ===== Dock auto-hide =====
 * Mouse/trackpad: the dock slides away when the pointer leaves it and comes
 * back when the pointer touches the bottom edge (#dz) or the dock.
 * Touch: same, but a small pill (#dh) stays; tap it or swipe up from the
 * bottom edge to show the dock, and it hides a few seconds after the last
 * tap outside it. Settings → Desktop → "Auto-hide dock" turns it off. */
(()=>{
 if(st.dah==null){st.dah=1;save()}
 const D=$('#dock'),body=document.body;
 const dz=document.createElement('div');dz.id='dz';dz.setAttribute('aria-hidden','true');
 const dh=document.createElement('button');dh.id='dh';dh.type='button';dh.setAttribute('aria-label','Show dock');dh.innerHTML='<i></i>';
 body.append(dz,dh);
 let t=0;const coarse=matchMedia('(hover: none), (pointer: coarse)');
 const on=()=>!!st.dah;
 const busy=()=>!!document.querySelector('.cm')||D.matches(':hover')||D.contains(document.activeElement);
 const show=()=>{clearTimeout(t);D.classList.remove('hid');body.classList.remove('dhid')};
 const hide=()=>{clearTimeout(t);if(!on())return;if(busy()){later(800);return}D.classList.add('hid');body.classList.add('dhid');D.querySelectorAll('button').forEach(x=>x.style.removeProperty('--s'))};
 const later=ms=>{clearTimeout(t);if(on())t=setTimeout(hide,ms)};
 window.dockShow=show;window.dockHideSoon=later;
 const apply=()=>{body.classList.toggle('dah',on());body.classList.toggle('touchy',coarse.matches);if(on())later(1600);else show()};
 // mouse
 D.addEventListener('pointerenter',e=>{if(e.pointerType=='mouse')show()});
 D.addEventListener('pointerleave',e=>{if(e.pointerType=='mouse')later(700)});
 dz.addEventListener('pointerenter',e=>{if(e.pointerType=='mouse'||e.pointerType=='pen')show()});
 dz.addEventListener('pointerleave',e=>{if(e.pointerType=='mouse'&&!D.matches(':hover'))later(900)});
 // keyboard: tabbing into the dock shows it
 D.addEventListener('focusin',show);D.addEventListener('focusout',()=>later(1200));
 // touch
 dh.addEventListener('click',e=>{e.stopPropagation();show();later(5000)});
 document.addEventListener('pointerdown',e=>{if(!on()||e.pointerType=='mouse')return;if(D.contains(e.target)){clearTimeout(t);later(5000)}else if(!D.classList.contains('hid')&&e.target!==dh)later(2500)},true);
 let sy=null;
 addEventListener('touchstart',e=>{const y=e.touches[0].clientY;sy=on()&&y>innerHeight-36?y:null},{passive:true});
 addEventListener('touchmove',e=>{if(sy!=null&&sy-e.touches[0].clientY>24){sy=null;show();later(5000)}},{passive:true});
 // opening an app from the dock: get out of the way soon after
 D.addEventListener('click',()=>{if(on())later(coarse.matches?1500:1200)});
 // context menu from the dock keeps it up; re-check after it closes
 new MutationObserver(()=>{if(!document.querySelector('.cm')&&on()&&!D.matches(':hover'))later(1200)}).observe(body,{childList:true});
 coarse.addEventListener&&coarse.addEventListener('change',apply);
 // settings toggle
 const _ap=applyStyle;applyStyle=function(){_ap();apply()};
 // the lock screen covers everything; show the dock again right after unlocking so people see it
 new MutationObserver(()=>{if($('#lock').classList.contains('off')){show();later(2200)}}).observe($('#lock'),{attributes:true,attributeFilter:['class']});
 apply();
 // keyboard on phones: keep windows above it
 const vv=window.visualViewport;
 if(vv){const kb=()=>{const k=Math.max(0,innerHeight-vv.height-vv.offsetTop);document.documentElement.style.setProperty('--kb',k+'px');body.classList.toggle('kbd',k>80)};vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb);kb()}
})();

</script>
