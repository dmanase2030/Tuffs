<!DOCTYPE html>
<html lang="en" data-accent="violet" data-density="comfortable">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuffs — Arcade & Web Portal</title>
  <meta name="description" content="Tuffs is a self-hosted arcade portal and Scramjet-powered web browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141417'/%3E%3Cpath d='M9 9l7 7 7-7M9 16l7 7 7-7' stroke='%238b5cf6' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/portal.css">
  <script src="config.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app" id="app">
    <nav class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/" data-route="home">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span class="brand-name">Tuffs</span>
      </a>
      <div class="nav" id="nav">
        <a class="nav-item" href="#/" data-route="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
          Home
        </a>
        <a class="nav-item" href="#/games" data-route="games">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="3"/><path d="M7 11v4M5 13h4M15.5 12h.01M18 14h.01"/></svg>
          All Games
          <span class="count" data-nav-count="games" hidden>0</span>
        </a>
        <a class="nav-item" href="#/favorites" data-route="favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.3.9-4.5 4.4 1 6.1L12 17.1l-5.5 2.9 1-6.1L3 9.5l6.3-.9z"/></svg>
          Favorites
          <span class="count" data-nav-count="favorites" hidden>0</span>
        </a>
        <a class="nav-item" href="#/recent" data-route="recent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          Recently Played
        </a>
        <a class="nav-item" href="/browse.html" data-route="browse">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18"/></svg>
          Browse
        </a>
        <a class="nav-item" href="#/settings" data-route="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4 1a7 7 0 0 0-2.1-1.2L14 2.9h-4l-.4 2.7a7 7 0 0 0-2.1 1.2l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 2.1 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2.1-1.2l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1.2z"/></svg>
          Settings
        </a>
        <a class="nav-item" href="#/about" data-route="about">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
          About / Credits
        </a>
      </div>
      <div class="sidebar-foot">
        Self-hosted portal · <a href="#/about">credits</a>
      </div>
    </nav>

    <div>
      <header class="topbar">
        <button class="topbar-btn nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          <span class="sr-only">Menu</span>
        </button>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="global-search" placeholder="Search games…" autocomplete="off" spellcheck="false" aria-label="Search games">
        </div>
        <div class="topbar-spacer"></div>
        <button class="topbar-btn" id="random-btn" title="Open a random game">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3"/><circle cx="15.5" cy="15.5" r="1.3"/><circle cx="15.5" cy="8.5" r="1.3"/><circle cx="8.5" cy="15.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/></svg>
          Random
        </button>
      </header>

      <main class="content" id="main" tabindex="-1">
        <div id="view" class="page"></div>
        <footer class="footer">
          <span>Tuffs — self-hosted arcade & web portal</span>
          <a href="#/about">Credits & licenses</a>
          <a href="#/settings">Privacy: what this portal stores</a>
        </footer>
      </main>
    </div>
  </div>

  <div id="toast-root" aria-live="polite"></div>
  <dialog id="confirm-dialog">
    <h2 id="confirm-title">Are you sure?</h2>
    <p id="confirm-body"></p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button class="btn btn-primary" id="confirm-ok">Confirm</button>
    </div>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
