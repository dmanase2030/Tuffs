<style>

[data-theme=light] .win .btn{background:rgba(0,0,0,.08);color:#1a1a1c}[data-theme=light] .win .btn.p{background:var(--acc);color:#fff}[data-theme=light] .win .chp{color:#1a1a1c}
.lib{flex:1;min-height:0;align-content:start}.tile{position:relative}
.tile .art{height:78px;margin:0;display:block;position:relative;overflow:hidden}.tile .art svg,.tile .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tile .tn{display:block;padding:8px 6px 0}

.tags{display:flex;gap:6px;padding:8px 12px;overflow:auto;flex:none}.chp{padding:5px 12px;border-radius:14px;background:var(--glass2);color:var(--fg);border:0;cursor:pointer;font:500 12px Inter;white-space:nowrap}.chp.on{background:var(--acc);color:#fff}
.app svg,.ic svg{border-radius:12px}

.urow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}

:root{--glass:rgba(15,18,30,.71);--glass2:rgba(68,78,106,.28);--fg:#f5f7ff;--mute:#aab3cc;--line:rgba(255,255,255,.16);--shadow:0 24px 75px rgba(3,5,16,.50);--ease:cubic-bezier(.2,.75,.2,1)}

/* Hypr edition · fast, offline-first, compositor-inspired UI */
:root{--glass:rgba(12,16,30,.81);--glass2:rgba(67,70,101,.26);--line:rgba(193,203,247,.15);--fg:#eef0ff;--mute:#aab0c8;--shadow:0 24px 90px rgba(0,0,0,.55);--hypr-purple:#b8a4f5}

.ws i{background:#7d83a2;width:7px;height:7px}.ws i.a{background:var(--acc);width:24px;box-shadow:0 0 12px color-mix(in srgb,var(--acc) 45%,transparent)}

.wall-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px;margin:3px 0 18px}
.wall-card{border:1px solid var(--line);padding:5px;border-radius:12px;min-width:0;background:rgba(255,255,255,.055);color:var(--fg);cursor:pointer;text-align:left;overflow:hidden}

function pickWall(file){

  setWall(c.toDataURL('image/jpeg',.79));
 };im.onerror=()=>toast('Could not open that image');im.src=String(r.result)};r.readAsDataURL(file)
}

function g2048(){const{w,body:b}=win("2048","",360,460);let g=Array(16).fill(0);const add=()=>{const e=g.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)g[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4};

function ttt(){const{body:b}=win("Tic Tac Toe","",320,400);let s=Array(9).fill(""),done=false;const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];const W=p=>L.some(l=>l.every(i=>s[i]==p));
const st=document.createElement("p"),bd=document.createElement("div");st.style.cssText="text-align:center;margin:8px;cursor:pointer";bd.style.cssText="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(240px,100%);margin:auto";b.append(st,bd);
const cpu=()=>{if(W("X")||!s.includes("")){done=true;return}const f=p=>{for(const l of L){const e=l.filter(i=>s[i]==""),m=l.filter(i=>s[i]==p);if(e.length==1&&m.length==2)return e[0]}};let m=f("O");if(m==null)m=f("X");if(m==null)m=s[4]==""?4:s.map((v,i)=>v?-1:i).filter(i=>i>=0)[0];s[m]="O";if(W("O")||!s.includes(""))done=true};
const draw=()=>{bd.innerHTML="";s.forEach((v,i)=>{const c=document.createElement("button");c.style.cssText="aspect-ratio:1;border-radius:8px;background:#2a2a2e;font:700 30px Inter;color:"+(v=="X"?"#4aa3ff":"#f7768e");c.textContent=v;c.onclick=()=>{if(v||done)return;s[i]="X";cpu();draw()};bd.append(c)});st.textContent=done?(W("X")?"You win":W("O")?"Computer wins":"Draw")+". Tap to restart":"Your move (X)"};
st.onclick=()=>{if(done){s.fill("");done=false;draw()}};draw()}
function mines(){const{body:b}=win("Minesweeper","",340,430),N=9;let m,r,f,over;const bd=document.createElement("div"),st=document.createElement("p");st.style.cssText="text-align:center;margin:8px;cursor:pointer";bd.style.cssText="display:grid;grid-template-columns:repeat(9,1fr);gap:2px;width:min(288px,100%);margin:auto";b.append(st,bd);
const nb=i=>{const x=i%N,y=(i-x)/N,o=[];for(let a=-1;a<2;a++)for(let c=-1;c<2;c++){const X=x+a,Y=y+c;if((a||c)&&X>=0&&Y>=0&&X<N&&Y<N)o.push(Y*N+X)}return o},cnt=i=>nb(i).filter(j=>m[j]).length;
const rev=i=>{if(r[i]||f[i]||over)return;r[i]=1;if(m[i]){over=1;m.forEach((v,j)=>v&&(r[j]=1))}else if(!cnt(i))nb(i).forEach(rev)};
const draw=()=>{if(!over&&r.filter(Boolean).length==71)over=2;st.textContent=over==1?"Boom. Tap to restart":over==2?"Cleared. Tap to restart":"Tap to reveal, hold or right click to flag";bd.innerHTML="";
for(let i=0;i<81;i++){const c=document.createElement("button");c.style.cssText=`aspect-ratio:1;border-radius:4px;font:700 13px Inter;color:#4aa3ff;background:${r[i]?(m[i]?"#c52a3a":"#1b1b1e"):"#3a3a40"}`;c.textContent=r[i]?(m[i]?"x":cnt(i)||""):f[i]?"⚑":"";
const fl=()=>{if(!r[i]&&!over){f[i]^=1;draw()}};c.onclick=()=>{rev(i);draw()};c.oncontextmenu=e=>{e.preventDefault();fl()};let t;c.onpointerdown=()=>t=setTimeout(fl,500);c.onpointerup=()=>clearTimeout(t);bd.append(c)}};
const init=()=>{m=Array(81).fill(0);r=Array(81).fill(0);f=Array(81).fill(0);over=0;let k=0;while(k<10){const i=Math.floor(Math.random()*81);if(!m[i]){m[i]=1;k++}}draw()};st.onclick=()=>over&&init();init()}
function breakout(){const{w,body:b}=win("Breakout","",360,460);const c=document.createElement("canvas");c.width=320;c.height=400;c.style.cssText="background:#0c0c0e;margin:auto;max-width:100%;touch-action:none;display:block";b.append(c);const x=c.getContext("2d");
let px=130,bx,by,vx,vy,br;const rs=()=>{bx=160;by=300;vx=2.6;vy=-3.2;br=[];for(let r=0;r<5;r++)for(let k=0;k<8;k++)br.push([k*40+2,r*18+30,36,14,r])};rs();

bx+=vx;by+=vy;if(bx<4||bx>316)vx=-vx;if(by<4)vy=-vy;if(by>380&&by<396&&bx>px&&bx<px+60&&vy>0){vy=-vy;vx=(bx-px-30)/9}if(by>410)rs();
br=br.filter(k=>{if(bx>k[0]&&bx<k[0]+k[2]&&by>k[1]&&by<k[1]+k[3]){vy=-vy;return false}return true});if(!br.length)rs();
x.fillStyle="#0c0c0e";x.fillRect(0,0,320,400);br.forEach(k=>{x.fillStyle=col[k[4]];x.fillRect(k[0],k[1],k[2],k[3])});x.fillStyle="#fff";x.fillRect(px,388,60,8);x.beginPath();x.arc(bx,by,5,0,7);x.fill()},16)}
