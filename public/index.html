<script>
/* Store uploaded images and GIFs as Blobs in IndexedDB, avoiding localStorage's small size limit. */
let customWallpaperURL=null;
let customWallpaperBlob=null;
let wallpaperRequest=0;
const wallpaperKey='haven_custom_wallpaper_v1';
function openWallpaperDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){reject(Error('IndexedDB unavailable'));return}
    const request=indexedDB.open('HavenWallpaperDB',1);
    request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('files'))request.result.createObjectStore('files')};
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}
async function wallpaperDB(action,blob){
  const db=await openWallpaperDB();
  try{
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction('files',action==='get'?'readonly':'readwrite');
      const store=tx.objectStore('files');
      const req=action==='get'?store.get('wallpaper:'+NS):action==='put'?store.put(blob,'wallpaper:'+NS):store.delete('wallpaper:'+NS);
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
      tx.onerror=()=>reject(tx.error);
    });
  }finally{db.close()}
}
function applyCustomWallpaper(){
  if(customWallpaperURL){
    document.documentElement.style.setProperty('--wall','url("'+customWallpaperURL+'")');
  }
  const preview=document.getElementById('custom-wallpaper-preview');
  if(preview){
    preview.style.backgroundImage=customWallpaperURL?'url("'+customWallpaperURL+'")':'var(--wall)';
  }
}
function showCustomWallpaper(blob){
  if(customWallpaperURL)URL.revokeObjectURL(customWallpaperURL);
  customWallpaperBlob=blob||null;
  customWallpaperURL=blob?URL.createObjectURL(blob):null;
  if(!blob){applyPrefs()}else{applyCustomWallpaper()}
}
async function restoreCustomWallpaper(){
  try{
    const blob=await wallpaperDB('get');
    if(blob instanceof Blob&&blob.size&&blob.type.startsWith('image/'))showCustomWallpaper(blob);
  }catch(e){
    console.warn('Saved wallpaper unavailable:',e);
  }
}
function addWallpaperControls(body){
  const wallSelect=body.querySelector('#wall');
  if(!wallSelect)return;
  const row=wallSelect.closest('.row');
  if(!row)return;
  const wrap=document.createElement('div');
  wrap.innerHTML=`
    <h3>Custom wallpaper</h3>
    <div class="mute">Upload a photo or animated GIF from your device.</div>
    <div id="custom-wallpaper-preview" aria-label="Wallpaper preview"></div>
    <div id="custom-wallpaper-controls">
      <input id="custom-wallpaper-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" aria-label="Choose wallpaper image or GIF">
      <button type="button" class="btn" id="custom-wallpaper-reset">Restore default wallpaper</button>
      <div class="mute" id="custom-wallpaper-status" role="status"></div>
    </div>`;
  row.insertAdjacentElement('afterend',wrap);
  const file=wrap.querySelector('#custom-wallpaper-file');
  const status=wrap.querySelector('#custom-wallpaper-status');
  file.addEventListener('change',async()=>{
    const blob=file.files&&file.files[0];
    if(!blob)return;
    if(!['image/png','image/jpeg','image/webp','image/gif','image/avif'].includes(blob.type)){
      status.textContent='Choose a JPG, PNG, WebP, AVIF, or GIF.';return;
    }
    if(blob.size>40*1024*1024){status.textContent='Choose a file under 40 MB.';return}
    const token=++wallpaperRequest;
    showCustomWallpaper(blob);
    status.textContent='Wallpaper applied. Saving…';
    try{
      await wallpaperDB('put',blob);
      if(token===wallpaperRequest)status.textContent='Wallpaper saved, including animation for GIFs.';
    }catch(e){
      if(token===wallpaperRequest)status.textContent='Wallpaper applied for this session. This browser could not save it permanently.';
      console.warn('Wallpaper save failed:',e);
    }
  });
  wrap.querySelector('#custom-wallpaper-reset').addEventListener('click',async()=>{
    const token=++wallpaperRequest;
    showCustomWallpaper(null);
    file.value='';
    status.textContent='Default wallpaper restored.';
    try{await wallpaperDB('delete')}catch(e){console.warn('Could not delete saved wallpaper:',e)}
    if(token===wallpaperRequest)status.textContent='Default wallpaper restored.';
  });
  applyCustomWallpaper();
}
restoreCustomWallpaper();
</script>
<style>
/* Lumio animations */
@keyframes l-pop{0%{opacity:0;transform:scale(.3) rotate(-12deg)}70%{transform:scale(1.08) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes l-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes l-fade{from{opacity:0}to{opacity:1}}
@keyframes l-win{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
@keyframes l-ind{from{width:0}to{width:12px}}
@keyframes l-glow{0%,100%{opacity:.55}50%{opacity:1}}
#boot svg rect{transform-box:fill-box;transform-origin:center;animation:l-pop .7s cubic-bezier(.2,.8,.3,1) both}
#boot svg rect:nth-child(2){animation-delay:.12s}#boot svg rect:nth-child(3){animation-delay:.24s}#boot svg rect:nth-child(4){animation-delay:.36s}
#boot svg+div{animation:l-rise .6s .55s both}
#boot .dots{animation:l-fade .5s .9s both}
.scr.on{animation:l-fade .4s ease-out}
#lock.open .panel{animation:l-rise .4s cubic-bezier(.2,.8,.3,1)}
.lclock{animation:l-rise .7s .1s both}
#welcome .bigav{animation:l-pop .6s both}
#welcome .pname{animation:l-rise .5s .2s both}
.win{animation:l-win .22s cubic-bezier(.2,.8,.3,1)}
.tbtn{transition:background .15s,transform .15s}
.tbtn:hover{transform:translateY(-2px)}
.tbtn:active{transform:scale(.88)}
.tbtn.running:after{animation:l-ind .25s ease-out;transition:width .2s}
.tbtn.running.active:after{width:18px}
.tray{transition:background .15s,transform .15s}
.tray:active{transform:scale(.92)}
#start.on .pin{animation:l-rise .3s both}
#start.on .pin:nth-child(2){animation-delay:.04s}#start.on .pin:nth-child(3){animation-delay:.08s}#start.on .pin:nth-child(4){animation-delay:.12s}
.pin{transition:background .15s,transform .15s}
.pin:hover{transform:translateY(-2px)}
.pin:active{transform:scale(.95)}
.gc{transition:transform .18s,box-shadow .18s}
.gc:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0002}
.btn,.chip,.lk,.sw,.ib,.seg button,.lnk{transition:background .15s,transform .12s,filter .15s}
.btn:active,.chip:active,.lk:active,.sw:active,.ib:active,.seg button:active{transform:scale(.95)}
.lk:hover,.chip:hover{transform:translateY(-1px)}
.set .row{animation:l-rise .35s both}
.set .row:nth-of-type(2){animation-delay:.04s}.set .row:nth-of-type(3){animation-delay:.08s}.set .row:nth-of-type(4){animation-delay:.12s}
.ntp>*{animation:l-rise .45s both}.ntp>*:nth-child(2){animation-delay:.08s}.ntp>*:nth-child(3){animation-delay:.16s}
.lhint{animation:l-glow 2.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.win,.scr,.panel,.pin,.gc,.row,.tbtn,.lclock,.ntp>*,.lhint,#boot svg rect,#boot svg+div,#boot .dots{animation:none!important;transition:none!important}}
</style>
<style>.cchips{padding:10px 14px}.cmsgs{flex:1;min-height:0;overflow:auto;padding:8px 14px;display:flex;flex-direction:column;gap:8px}.cm{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--str);align-self:flex-start;word-break:break-word;animation:l-rise .25s both}.cm.me{align-self:flex-end;background:var(--acc);color:var(--acc-t);border-color:transparent}.cm b{display:block;font-size:12px;font-weight:600;opacity:.85}.cm small{margin-left:6px;font-weight:400;opacity:.7;font-size:11px}.cnote{padding:0 14px 10px}</style>
<style>
/* Lumio animations v2 */
@keyframes l-drift{0%{transform:scale(1.08) translate3d(-2%,-1.5%,0)}50%{transform:scale(1.14) translate3d(2%,1%,0)}100%{transform:scale(1.1) translate3d(-1%,2%,0)}}
@keyframes l-min{to{opacity:0;transform:translateY(40px) scale(.9)}}
@keyframes l-close{to{opacity:0;transform:scale(.94)}}
@keyframes l-bub{from{opacity:0;transform:scale(.8) translateY(8px)}to{opacity:1;transform:none}}
@keyframes l-logo{0%,100%{filter:drop-shadow(0 0 10px rgba(10,132,232,.35))}50%{filter:drop-shadow(0 0 26px rgba(76,180,255,.75))}}
@keyframes l-ring{0%{box-shadow:0 0 0 0 rgba(10,132,232,.45),0 8px 32px #0003}100%{box-shadow:0 0 0 22px rgba(10,132,232,0),0 8px 32px #0003}}
@keyframes l-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
html{background:var(--win)}
body{background:transparent!important}
body::before{content:"";position:fixed;inset:-8%;z-index:-1;background:var(--wall);background-size:cover;background-position:center;background-repeat:no-repeat;animation:l-drift 40s ease-in-out infinite alternate;will-change:transform}
#boot svg{animation:l-logo 2.4s ease-in-out 1s infinite}
.win.minning{animation:l-min .19s ease-in forwards;pointer-events:none}
.win.closing{animation:l-close .18s ease-in forwards}
.win{animation-duration:.3s;transition:box-shadow .25s}
#start{transition:opacity .2s,transform .32s cubic-bezier(.2,.9,.3,1.15)}
.bigav{animation:l-ring 2.6s ease-out infinite}
#lock.open .bigav{animation:l-ring 2.6s ease-out infinite}
.lclock #lt{animation:l-float 7s ease-in-out infinite}
.cm{animation:l-bub .28s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:bottom left}
.cm.me{transform-origin:bottom right}
.wb>*{animation:l-fade .3s both}
html,body,.win,.tb,.mica,.row,.gc,.chip,.addr,.fld,.cm,.lk,.btn,select,.card{transition-property:background-color,border-color,color,box-shadow,transform,filter,opacity;transition-duration:.3s}
.tbtn,.tray,.pin,.gc,.btn,.chip,.lk,.sw,.ib,.seg button{transition-duration:.15s}
.sw{transition:transform .15s,outline-color .2s}
.sw:hover{transform:scale(1.15)}
.sw.on{transform:scale(1.1)}
.row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:44px;height:24px;min-width:44px;border-radius:12px;background:var(--hov);border:1px solid var(--mute);position:relative;cursor:pointer;margin:0;transition:background-color .25s,border-color .25s}
.row input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:transform .25s cubic-bezier(.3,1.4,.5,1),background-color .25s,width .15s}
.row input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
.row input[type=checkbox]:checked::after{transform:translateX(20px);background:var(--acc-t)}
.row input[type=checkbox]:active::after{width:20px}
.row input[type=checkbox]:checked:active::after{transform:translateX(16px)}
*{scrollbar-width:thin}.ctl button{touch-action:manipulation;-webkit-user-select:none;user-select:none;min-height:40px}.ctl button *{pointer-events:none}
@media(prefers-reduced-motion:reduce){body::before,#boot svg,.bigav,.lclock #lt,.cm,.wb>*,.win.minning,.win.closing{animation:none!important}.win.minning,.win.closing{opacity:0}*{transition-duration:.01s!important}}
</style>
<style>
#wdg{position:absolute;top:calc(24px + env(safe-area-inset-top,0px));left:32px;pointer-events:none;color:var(--txt);animation:l-rise .8s .2s both}
#wt{font-size:clamp(44px,8vw,72px);font-weight:300;line-height:1;letter-spacing:-1px}#wd{font-size:clamp(14px,2.4vw,18px);opacity:.75;margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(66px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px) scale(.96);opacity:0;pointer-events:none;z-index:30000;padding:10px 18px;border-radius:20px;background:var(--mica);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--str);box-shadow:0 8px 28px #0003;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
@media(min-width:701px){.win:not(.max){resize:both}}
.gwrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;margin:auto;width:100%;max-width:100%}
.gcv{width:min(100%,300px);aspect-ratio:1;border-radius:12px;border:1px solid var(--str);touch-action:none;background:#0f172a}
.gpad{display:flex;flex-direction:column;align-items:center;gap:6px}.gpad>div{display:flex;gap:6px}
.gdir{width:56px;height:44px;display:grid;place-items:center;padding:0}
.g48{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;width:min(100%,320px);aspect-ratio:1;border-radius:12px;background:var(--hov);border:1px solid var(--str);touch-action:none}
.t48{border-radius:8px;display:grid;place-items:center;font-weight:600;background:var(--card);border:1px solid var(--str);transition:background-color .15s}
.t48.new{animation:l-pop .25s both}
.gttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,300px);aspect-ratio:1}
.ttc{border-radius:12px;background:var(--card);border:1px solid var(--str);font-size:44px;font-weight:300;display:grid;place-items:center;color:var(--txt)}
.ttc:disabled{opacity:1}.ttc.X{color:var(--acc)}.ttc.O{color:#d13438}
.ttc:not(:disabled):hover{background:var(--hov)}
@media(prefers-reduced-motion:reduce){#wdg,#toast,.t48.new{animation:none!important}}
</style>
</body></html>
