/* ===== dock auto-hide ===== */
#dock{transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s}
body.dah #dock.hid{transform:translate(-50%,calc(100% + 26px + env(safe-area-inset-bottom,0px)));opacity:0;pointer-events:none}
body.dah.cros #dock.hid,body.dah.win #dock.hid{transform:translateY(calc(100% + 8px))}
#dz{position:fixed;left:0;right:0;bottom:0;height:6px;z-index:899;display:none}
body.dah:not(.touchy) #dz{display:block}
#dh{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:140px;height:calc(22px + env(safe-area-inset-bottom,0px));padding:0 0 calc(7px + env(safe-area-inset-bottom,0px));display:none;align-items:flex-end;justify-content:center;z-index:899;opacity:0;transition:opacity .25s}
#dh i{display:block;width:96px;height:5px;border-radius:3px;background:rgba(255,255,255,.75);box-shadow:0 1px 6px #0008}
body.dah.touchy.dhid #dh{display:flex;opacity:1}
body.kbd #dh,body.kbd #dock{display:none}
@media(max-width:700px){body.dah .win{bottom:max(calc(24px + env(safe-area-inset-bottom,0px)),var(--kb,0px))!important}body:not(.dah) .win{bottom:max(calc(74px + env(safe-area-inset-bottom,0px)),var(--kb,0px))!important}}

/* ===== Lumio AI ===== */
.ai{position:absolute;inset:0;display:flex;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,rgba(255,190,110,.12),transparent 60%),linear-gradient(rgba(20,12,8,.25),rgba(12,8,6,.45));--aiw:760px}
.aimain{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
/* sidebar: persistent when wide, drawer when narrow */
.aisd{width:264px;flex:none;display:flex;flex-direction:column;gap:6px;padding:12px 10px;background:rgba(22,14,10,.72);border-right:1px solid var(--line);backdrop-filter:blur(18px)}
.ai:not(.wide) .aisd{position:absolute;top:0;bottom:0;left:0;z-index:6;width:min(300px,86%);transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:12px 0 40px #0008;background:rgba(28,18,12,.97)}
.ai.dopen .aisd{transform:none}
.aiscrim{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.ai.dopen:not(.wide) .aiscrim{opacity:1;pointer-events:auto}
.ai.wide.sdoff .aisd{display:none}
.aisdh{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}.aisdh b{flex:1;font-size:15px;letter-spacing:.01em}
.ai.wide .aisdh [data-close]{display:none}
.aimark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#2a1608;background:linear-gradient(145deg,#ffe0a6,var(--a))}.aimark svg{width:17px;height:17px}
.ainew{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid var(--line)}.ainew:hover{background:rgba(255,255,255,.13)}.ainew svg{width:17px;height:17px}
.aisl{flex:1;overflow-y:auto;margin:4px -4px 0;padding:0 4px;overscroll-behavior:contain}
.aisg2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.5;padding:12px 8px 4px}
.aipi{display:flex;align-items:center;border-radius:10px}.aipi.on{background:color-mix(in srgb,var(--a) 22%,transparent)}.aipi:hover{background:rgba(255,255,255,.07)}
.aipi button:first-child{flex:1;min-width:0;text-align:left;padding:10px 10px;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aipi button:last-child{width:34px;height:34px;border-radius:8px;opacity:0;display:grid;place-items:center}.aipi:hover button:last-child,.aipi.on button:last-child{opacity:.6}.aipi button:last-child:hover{opacity:1;background:rgba(255,255,255,.1)}
@media (pointer:coarse){.aipi button:last-child{opacity:.55}}
.aipi button:last-child svg{width:15px;height:15px}
.aiemptyl{font-size:12.5px;opacity:.6;padding:12px 8px;line-height:1.5}
.aisf{padding:4px 8px}.aisf .lnk{font-size:12px;opacity:.7}
/* header */
.aih{display:flex;align-items:center;gap:6px;padding:8px 10px;flex:none;border-bottom:1px solid rgba(255,255,255,.07)}
.aiti{flex:1;min-width:0;text-align:center;line-height:1.2}.aiti b{display:block;font-size:14.5px;letter-spacing:.01em}
.ait{display:block;font-size:11.5px;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ait:empty{display:none}
.aib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}.aib:hover{background:rgba(255,255,255,.1)}.aib svg{width:20px;height:20px}
/* messages */
.aim{flex:1;overflow-y:auto;padding:18px max(14px,calc((100% - var(--aiw)) / 2)) 10px;display:flex;flex-direction:column;gap:18px;user-select:text;overscroll-behavior:contain;scroll-behavior:auto}
.aim-r{display:flex;gap:10px;max-width:100%;animation:aiin .25s ease-out}@keyframes aiin{from{opacity:0;transform:translateY(6px)}}
.aim-r.u{justify-content:flex-end}
.aiu{max-width:min(82%,560px);padding:10px 14px;border-radius:20px 20px 6px 20px;background:linear-gradient(160deg,#ffcf8a,var(--a));color:#2a1608;font-size:15px;line-height:1.45;overflow-wrap:anywhere;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.aia{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#2a1608;background:linear-gradient(145deg,#ffe0a6,var(--a));margin-top:1px;box-shadow:0 3px 10px rgba(0,0,0,.3)}.aia svg{width:18px;height:18px}
.aiw{flex:1;min-width:0}
.aimd{font-size:15px;line-height:1.62;overflow-wrap:anywhere;color:rgba(255,255,255,.94)}
.aimd>*+*{margin-top:10px}.aimd h3,.aimd h4,.aimd h5,.aimd h6{font-size:15.5px;margin-top:14px}
.aimd ul,.aimd ol{padding-left:22px}.aimd li+li{margin-top:4px}.aimd li::marker{color:var(--a)}
.aimd strong{color:#fff}
.aimd a{color:#ffcf8a;text-decoration:underline;text-underline-offset:2px}
.aimd code{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px}
.aimd blockquote{border-left:3px solid var(--a);padding-left:12px;opacity:.9}
.aimd hr{border:0;border-top:1px solid var(--line)}
.aicb{border-radius:12px;overflow:hidden;background:#140d09;border:1px solid var(--line)}
.aicbh{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:11.5px;opacity:.85;background:rgba(255,255,255,.05)}
.aicbh button{font-size:11.5px;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.1)}
.aicb pre{margin:0;padding:12px;overflow-x:auto}.aicb code{background:none;padding:0;font-size:13px;white-space:pre}
.aiact{display:flex;gap:4px;margin-top:8px;opacity:.75}.aiact[hidden]{display:none}
.aiact button{display:flex;align-items:center;gap:5px;font-size:12px;padding:5px 9px;border-radius:8px}.aiact button:hover{background:rgba(255,255,255,.1)}.aiact svg{width:14px;height:14px}
.aix{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 13px;border-radius:14px;background:rgba(255,120,90,.12);border:1px solid rgba(255,140,110,.35);font-size:13.5px;line-height:1.45;color:#ffd8cc;flex:1;min-width:0}
.aity{display:inline-flex;gap:4px;padding:6px 2px}.aity i{width:7px;height:7px;border-radius:50%;background:var(--a);opacity:.4;animation:aib 1.2s infinite}.aity i:nth-child(2){animation-delay:.15s}.aity i:nth-child(3){animation-delay:.3s}
@keyframes aib{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:.95;transform:translateY(-3px)}}
.aicar{display:inline-block;width:8px;height:16px;margin-left:2px;vertical-align:-3px;background:var(--a);border-radius:3px;animation:aic 1s ease-in-out infinite}@keyframes aic{50%{opacity:.15}}
/* empty state */
.aiempty{margin:auto;text-align:center;padding:12px 2px;width:100%;max-width:560px}
.aibig{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:20px;color:#2a1608;background:linear-gradient(145deg,#ffe3ad,var(--a));box-shadow:0 10px 40px color-mix(in srgb,var(--a) 45%,transparent),inset 0 1px 0 #fff8;animation:aiglow 4s ease-in-out infinite}.aibig svg{width:34px;height:34px}
@keyframes aiglow{50%{box-shadow:0 10px 54px color-mix(in srgb,var(--a) 65%,transparent),inset 0 1px 0 #fff8}}
.aiempty h3{font-size:22px;font-weight:650;margin:16px 0 6px;letter-spacing:-.01em}
.aiempty p{font-size:13.5px;opacity:.7;line-height:1.5;margin:0 auto 18px;max-width:420px}
.aisg{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.aisg button{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);min-width:0;transition:background .15s,border-color .15s,transform .1s}.aisg button:hover{background:rgba(255,255,255,.11);border-color:color-mix(in srgb,var(--a) 70%,transparent)}.aisg button:active{transform:scale(.98)}
.aisg b{display:block;font-size:13.5px}.aisg small{display:block;font-size:12px;opacity:.62;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:360px){.aisg{grid-template-columns:1fr}.aiempty h3{font-size:19px}}
.aie{margin:0 auto 8px;width:calc(100% - 24px);max-width:var(--aiw);padding:10px 12px;border-radius:12px;background:rgba(240,160,64,.14);border:1px solid rgba(240,160,64,.4);font-size:13px;line-height:1.45;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.aie span{flex:1;min-width:180px}.aie[hidden]{display:none}
/* composer */
.aicomp{flex:none;padding:6px 12px 0;width:100%;max-width:calc(var(--aiw) + 24px);margin:0 auto}
.aif{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 16px;border-radius:24px;background:rgba(255,255,255,.09);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.25);transition:border-color .15s}
.aif:focus-within{border-color:color-mix(in srgb,var(--a) 80%,transparent)}
.aif textarea{flex:1;min-width:0;resize:none;background:none;border:0;outline:0;color:#fff;font:16px/1.45 system-ui,-apple-system,sans-serif;padding:7px 0;max-height:160px;user-select:text}
.aif textarea::placeholder{color:rgba(255,255,255,.5)}
.ais{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--a);color:#2a1608;transition:transform .1s}.ais:active{transform:scale(.92)}.ais svg{width:19px;height:19px}.ais.stop{background:rgba(255,255,255,.9)}
.ain{display:block;text-align:center;font-size:10.5px;opacity:.45;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px))}
body.kbd .ain{display:none}body.kbd .aicomp{padding-bottom:6px}
/* open-game/app buttons */
.aiacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.aiop{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 15px 8px 11px;border-radius:13px;border:1px solid color-mix(in srgb,var(--a) 55%,transparent);background:color-mix(in srgb,var(--a) 20%,rgba(255,255,255,.05));color:#fff;font:600 13.5px/1.2 inherit;cursor:pointer;max-width:100%;transition:background .15s,transform .1s}
.aiop svg{width:18px;height:18px;flex:none}.aiop span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aiop:hover{background:color-mix(in srgb,var(--a) 34%,rgba(255,255,255,.08))}.aiop:active{transform:scale(.97)}
/* admin + code cards */
.aicard{margin-top:12px;border-radius:16px;padding:14px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--a) 45%,transparent);box-shadow:0 8px 26px rgba(0,0,0,.25)}
.aicard.bad{border-color:rgba(255,130,110,.45)}.aicard.bad p{font-size:13px;opacity:.8;margin-top:4px}
.aicardh{display:flex;gap:10px;align-items:center}.aicardh small{display:block;font-size:11px;opacity:.65;letter-spacing:.02em}.aicardh b{display:block;font-size:15px;margin-top:1px}
.aicardi{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;color:#2a1608;background:linear-gradient(145deg,#ffe0a6,var(--a))}.aicardi svg{width:19px;height:19px}
.aikvs{margin-top:12px;border-radius:12px;background:rgba(0,0,0,.18);padding:4px 12px}
.aikv{display:flex;gap:12px;justify-content:space-between;padding:8px 0;font-size:13.5px}.aikv+.aikv{border-top:1px solid rgba(255,255,255,.07)}.aikv span{opacity:.65;flex:none}.aikv b{text-align:right;overflow-wrap:anywhere;font-weight:600}
.aicbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.aicbtn .btn{min-height:40px;padding:9px 16px;font-size:13.5px;border-radius:11px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center}
@media(max-width:480px){.aicbtn .btn{flex:1;justify-content:center}}
.aistat{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;line-height:1.45;opacity:.85}.aistat svg{width:18px;height:18px;flex:none;color:#9be39b}
.aistat.ok{opacity:1}.aistat.bad{color:#ffb4a6;opacity:1}.aistat.warn{padding:10px 12px;border-radius:11px;background:rgba(240,160,64,.14);border:1px solid rgba(240,160,64,.4);opacity:1}
.aistats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.aistats div{padding:10px;border-radius:12px;background:rgba(0,0,0,.2)}.aistats b{display:block;font-size:20px}.aistats small{font-size:11.5px;opacity:.65}
.aicsum{font-size:13.5px;opacity:.8;margin-top:10px;line-height:1.5}
.aidf{margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#120b08}
.aidf summary{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:12.5px;cursor:pointer;background:rgba(255,255,255,.05)}.aidf summary code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aibadge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(120,170,255,.25)}.aibadge.a{background:rgba(110,210,120,.28)}
.aidiff{margin:0;max-height:320px;overflow:auto;padding:8px 0;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dl{display:block;padding:0 12px;white-space:pre}.dl.a{background:rgba(80,200,110,.16);color:#c8f5cf}.dl.d{background:rgba(255,100,90,.16);color:#ffc9c2}.dl.h{color:#ffcf8a;opacity:.8}

.lumioupd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:100000;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:14px;background:rgba(36,22,12,.94);color:#fff;border:1px solid rgba(255,190,110,.45);box-shadow:0 12px 34px rgba(0,0,0,.45);font-size:14px;max-width:calc(100vw - 24px)}
.lumioupd button{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;background:#f2a54a;color:#2a1608;cursor:pointer}

/* Lumio AI in the dock: accent tile so it stands out from the plain apps */
#dock button[data-a=ai]{background:linear-gradient(150deg,#ffd79a,var(--a,#f2a54a) 70%);color:#2a1608;border-color:rgba(255,226,180,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px rgba(242,165,74,.45)}
#dock button[data-a=ai]:hover{color:#1e0f04}
#dock button[data-a=ai] svg{stroke-width:1.9}
.aistat.ok span{white-space:pre-line}

/* menubar logo + About use the app icon */
#mb .lg{background:url(/launcher/icon.svg) center/cover;border-radius:4px}
.lgx{background:url(/launcher/icon.svg) center/cover!important}
/* consistent warm dock tiles */
#dock button{background:linear-gradient(150deg,rgba(255,208,140,.30),rgba(255,170,90,.06) 60%,rgba(255,255,255,.03));border:1px solid rgba(255,216,165,.22);color:#ffe8c8;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 12px rgba(0,0,0,.25)}
#dock button:hover{color:#fff4e2}

.adw{display:flex;flex-direction:column;height:100%;min-height:0}
.adt{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);flex:none}
.adt::-webkit-scrollbar{display:none}
.adt button{flex:none;padding:8px 14px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.adt button.on{background:var(--a);color:#2a1608;border-color:transparent;font-weight:600}
.adn{display:none;margin:10px 12px 0;padding:8px 12px;border-radius:10px;font-size:12.5px;background:color-mix(in srgb,var(--a) 20%,rgba(255,255,255,.05));border:1px solid color-mix(in srgb,var(--a) 40%,transparent)}
.adn.on{display:block}.adn.bad{background:rgba(255,90,90,.14);border-color:rgba(255,110,110,.45)}
.adb{flex:1;min-height:0;overflow:auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.adb h4{margin:16px 0 8px;font-size:13px;opacity:.85}
.adm{font-size:12px;opacity:.72;line-height:1.5}.adm.bad{color:#ff9a9a;opacity:1}
.adg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ads{padding:12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.ads b{display:block;font-size:22px;font-weight:600}.ads small{font-size:11.5px;opacity:.72}
.adr{padding:10px 12px;margin-bottom:8px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}
.adr p{margin:4px 0;line-height:1.45}.adr small{display:block;font-size:11.5px;opacity:.7;margin-top:3px}
.adrh{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.adp{font-style:normal;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--a) 30%,transparent)}
.adp.bad{background:rgba(255,90,90,.3)}
.adacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.adacts .btn,.adbar .btn,.adsave{min-height:36px;padding:8px 12px;font-size:12.5px}
.btn.adx{color:#ffb0a8}
.adbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.adbar input,.adbar select{flex:1;min-width:0}
.adbar select{background:rgba(255,255,255,.12);border:1px solid var(--line);color:#fff;border-radius:20px;padding:8px 12px;font-size:13px}
.adbar select option{color:#000}
.adreset{padding:10px 12px;margin-bottom:10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--a) 45%,transparent);background:rgba(255,255,255,.05)}
.adann{border-radius:10px}
.adsave{margin-top:12px;width:100%}
#rst{position:fixed;inset:0;z-index:1500;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.45);backdrop-filter:blur(12px)}
.rsf{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:16px;background:var(--glass);border:1px solid var(--line);text-align:center}
.rsf small{opacity:.7;font-size:12px}
@media (max-width:600px){.adacts .btn{flex:1 1 auto}}
.adt[hidden]{display:none}

/* ===== Browser (tabs) ===== */
.br{position:absolute;inset:0;display:flex;flex-direction:column;background:rgba(18,12,9,.35)}
.brtabs{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;overflow-x:auto;scrollbar-width:none;flex:none;background:rgba(0,0,0,.22)}
.brtabs::-webkit-scrollbar{display:none}
.br.narrow .brtabs{display:none}
.brtab{display:flex;align-items:center;gap:8px;min-width:120px;max-width:220px;flex:1 1 180px;height:36px;padding:0 6px 0 12px;border-radius:11px 11px 0 0;font-size:12.5px;cursor:pointer;color:rgba(255,255,255,.75);position:relative;transition:background .15s}
.brtab:hover{background:rgba(255,255,255,.06)}
.brtab.on{background:rgba(52,34,24,.95);color:#fff}
.brtab:not(.on)+.brtab:not(.on)::before{content:'';position:absolute;left:-1px;top:10px;bottom:10px;width:1px;background:rgba(255,255,255,.12)}
.brtt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

(()=>{const R=document.documentElement,K='lumio_pin';

<script>
/* ===== Tuffs launcher: accounts, proxy browser, game catalog =====
 * Accounts use the same /api/auth/* endpoints and the same 'lumio_session'
 * localStorage entry ({u,t} bearer token) as the main Tuffs site, so signing
 * in here also signs you in there and vice versa. */
let AUTH={mode:'out',name:'',admin:false},SESSION=null,PENDING=null,AMODE='in';
try{SESSION=JSON.parse(localStorage.getItem('lumio_session')||'null')}catch(e){SESSION=null}
const PROXY='/service/',SEARCH='https://www.bing.com/search?q=';
const QUICK=[['Google','https://www.google.com'],['YouTube','https://www.youtube.com'],['Wikipedia','https://www.wikipedia.org'],['Reddit','https://www.reddit.com']];
const USER_RE=/^[\w.-]{3,20}$/;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
function initial(){return ((AUTH.name||'Guest')[0]||'?').toUpperCase()}
function saveSession(u,t){SESSION={u,t};try{localStorage.setItem('lumio_session',JSON.stringify(SESSION))}catch(e){}}
function clearSession(){SESSION=null;try{localStorage.removeItem('lumio_session')}catch(e){}}
async function authPost(path,body){try{const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json',...(SESSION?{authorization:'Bearer '+SESSION.t}:{})},body:JSON.stringify(body||{})});const d=await r.json().catch(()=>({}));if(!r.ok)return{error:d.error||('Request failed ('+r.status+')'),status:r.status};return d}catch(e){return{error:'Network error. Try again.'}}}
function paintUser(){const n=AUTH.mode=='out'?'':AUTH.name,i=AUTH.mode=='out'?'?':initial();
 $('#lav').textContent=i;$('#lname').textContent=n;
 const ca=$('#ccav');if(ca){ca.textContent=i;$('#ccname').textContent=n||'Not signed in';$('#ccsub').textContent=AUTH.mode=='user'?(AUTH.admin?'Tuffs account · admin':'Tuffs account'):'Guest, nothing is saved to an account';const so=$('#cc [data-so]');if(so)so.textContent=AUTH.mode=='user'?'Sign out':'Sign in'}
 if(typeof repaintSettings=='function'&&document.querySelector('.stw'))repaintSettings();
 document.querySelectorAll('[data-acct]').forEach(b=>lumioAccount(b));document.querySelectorAll('[data-chat]').forEach(b=>b.repaint&&b.repaint());if(typeof adminDock=='function')adminDock()}
function setAMode(m){AMODE=m;document.querySelectorAll('#af .seg2 button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));$('#ac').hidden=m=='in';$('#ap').autocomplete=m=='in'?'current-password':'new-password';$('#ago').textContent=m=='in'?'Sign in':'Create account';$('#ae').textContent=''}
function showLock(msg){const L=$('#lock');L.classList.remove('off');const out=AUTH.mode=='out';$('#af').hidden=!out;$('#lin').hidden=out;
 if(out){$('#ap').value='';$('#ac').value='';if(!$('#au').value&&SESSION&&SESSION.u)$('#au').value=SESSION.u;$('#ae').textContent=msg||''}
 else $('#lhint').textContent=msg||'Tap or press any key to unlock';
 $('#lso').textContent=AUTH.mode=='guest'?'Sign in to an account':'Not you? Sign out';paintUser()}
function lockNow(){document.querySelectorAll('.cm').forEach(m=>m.remove());showLock()}
function unlock(){if(AUTH.mode=='out')return;$('#lock').classList.add('off');if(PENDING){const h=PENDING;PENDING=null;open(h)}}
function signedIn(d,unlockNow){saveSession(d.username,d.token);AUTH={mode:'user',name:d.username,admin:!!d.isAdmin};try{sessionStorage.removeItem('lumio_guest')}catch(e){}paintUser();if(unlockNow)unlock()}
function closeAll(){document.querySelectorAll('.win').forEach(w=>{w.onclose&&w.onclose();w.remove()});for(const k in open_)delete open_[k];dockUpd();fgName(null)}
async function signOut(){if(AUTH.mode=='user'&&SESSION)authPost('/api/auth/logout',{});clearSession();try{sessionStorage.removeItem('lumio_guest')}catch(e){}
 AUTH={mode:'out',name:'',admin:false};closeAll();setAMode('in');$('#au').value='';showLock()}
async function bootAuth(){
 const f=$('#af');setAMode('in');
 f.querySelectorAll('.seg2 button').forEach(b=>b.onclick=()=>setAMode(b.dataset.m));
 $('#lso').onclick=e=>{e.stopPropagation();signOut()};
 $('#agu').onclick=()=>{AUTH={mode:'guest',name:'Guest',admin:false};try{sessionStorage.setItem('lumio_guest','1')}catch(e){}paintUser();unlock()};
 let busy=false;
 f.onsubmit=async e=>{e.preventDefault();if(busy)return;const u=$('#au').value.trim(),p=$('#ap').value,er=$('#ae');er.textContent='';
  if(!u||!p){er.textContent='Enter your username and password.';return}
  if(AMODE=='up'){if(!USER_RE.test(u)){er.textContent='Username must be 3–20 letters, numbers, dots, _ or -';return}if(p.length<4){er.textContent='Password must be at least 4 characters';return}if(p!==$('#ac').value){er.textContent='Passwords do not match';return}}
  busy=true;const go=$('#ago'),lab=go.textContent;go.disabled=true;go.textContent=AMODE=='in'?'Signing in…':'Creating account…';
  try{const d=await authPost(AMODE=='in'?'/api/auth/login':'/api/auth/signup',{username:u,password:p});
   if(d.error)er.textContent=d.error;else{try{if(window.PasswordCredential&&navigator.credentials)navigator.credentials.store(new PasswordCredential({id:u,password:p})).catch(()=>{})}catch(_){}signedIn(d,true);toast(AMODE=='in'?'Welcome back, '+d.username:'Account created. Welcome, '+d.username)}}
  finally{busy=false;go.disabled=false;go.textContent=lab}};
 let guest=false;try{guest=sessionStorage.getItem('lumio_guest')=='1'}catch(e){}
 if(SESSION&&SESSION.t){AUTH={mode:'user',name:SESSION.u||'',admin:false};showLock('Checking your account…');
  try{const r=await fetch('/api/auth/me',{headers:{authorization:'Bearer '+SESSION.t}});const d=await r.json().catch(()=>({}));
   if(r.ok){AUTH={mode:'user',name:d.username,admin:!!d.isAdmin};SESSION.u=d.username;saveSession(d.username,SESSION.t);showLock()}
   else if(r.status==401){clearSession();AUTH={mode:'out',name:'',admin:false};showLock('You were signed out. Sign in again.')}
   else{AUTH={mode:'out',name:'',admin:false};showLock(d.error||'Accounts are unavailable right now. Try again soon.')}}
  catch(e){showLock('Offline. Tap to unlock with your saved sign-in.')}}
 else if(guest){AUTH={mode:'guest',name:'Guest',admin:false};showLock()}
 else showLock()}

/* ---- Account app ---- */
function lumioAccount(b){b.dataset.acct=1;const u=AUTH.mode=='user';const tab=b.acTab=u?(b.acTab||'account'):'account';
 b.innerHTML=`${u?`<div class=actabs role=tablist><button type=button role=tab data-act=account class="${tab=='account'?'on':''}">Account</button><button type=button role=tab data-act=profile class="${tab=='profile'?'on':''}">Profile</button></div>`:''}<div class=acbody></div>`;
 const body=b.querySelector('.acbody');
 if(tab=='profile'&&typeof lumioProfileEdit=='function')lumioProfileEdit(body);
 else{body.innerHTML=`<div class=pad style="text-align:center"><div class="acc acav">${esc(initial())}</div><b style="font-size:16px">${esc(AUTH.name||'Guest')}</b><p style="font-size:12px;opacity:.75;margin-top:6px;line-height:1.5">${u?(AUTH.admin?'Signed in to your Lumio account (admin).':'Signed in to your Lumio account. It works on any device.'):'You are using Lumio as a guest. Your settings stay in this browser only.'}</p><div class=row style="justify-content:center;margin-top:14px;flex-wrap:wrap"><button class=btn data-lock>Lock screen</button><button class="btn ${u?'':'acc'}" data-out>${u?'Sign out':'Sign in or create account'}</button></div></div>`;
  body.querySelector('[data-lock]').onclick=()=>lockNow();body.querySelector('[data-out]').onclick=()=>signOut();
  if(u&&typeof pfApi=='function')pfApi('/api/profile').then(d=>{const av=body.querySelector('.acav');if(av&&d.profile){const p=d.profile;av.outerHTML=pfAvatar({...p,name:p.displayName},'pfav acav2')}}).catch(()=>{})}
 b.showTab=t=>{b.acTab=t;lumioAccount(b)};
 const tb=b.querySelector('.actabs');if(tb)tb.onclick=e=>{const t=e.target.closest('[data-act]');if(t)b.showTab(t.dataset.act)}}

/* ---- Browser app: pages load through the site's /service/ proxy ---- */
function parseAddr(v){v=(v||'').trim();if(!v)return null;if(/^https?:\/\//i.test(v))return v;if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(v))return 'https://'+v;return SEARCH+encodeURIComponent(v)}
/* /service/https:/host/path keeps the site's own path, so relative links resolve inside the proxy */
function proxify(u){if(/^\s*(javascript|data|vbscript):/i.test(u))return 'about:blank';return /^https?:\/\//i.test(u)?PROXY+u.replace(/^(https?):\/\//i,'$1:/'):u}
function unproxy(path){if(path.indexOf(PROXY)!==0)return null;const raw=path.slice(PROXY.length),m=raw.match(/^(https?):\/+(.*)$/i);if(m)return m[1]+'://'+m[2];try{return decodeURIComponent(raw)}catch(e){return null}}
/* Register the proxy's service worker early so the first page already loads fully. */
try{if(navigator.serviceWorker&&isSecureContext)navigator.serviceWorker.register('/service/__sw.js',{scope:'/service/'}).catch(()=>{})}catch(e){}
function newTab(u){const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove()}
function lumioBrowser(b){
 b.innerHTML=`<div class=lb><div class=lbt><button class=lbb data-b=back aria-label=Back>${ic('<path d="M15 5l-7 7 7 7"/>')}</button><button class=lbb data-b=fwd aria-label=Forward>${ic('<path d="M9 5l7 7-7 7"/>')}</button><button class=lbb data-b=re aria-label=Reload>${ic('<path d="M20 12a8 8 0 11-2.3-5.6M20 4v5h-5"/>')}</button><form class=lbf><input name=q placeholder="Search or enter address" autocapitalize=none spellcheck=false enterkeyhint=go aria-label="Address"></form><button class=lbb data-b=ext aria-label="Open in new tab">${ic('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>')}</button></div>
 <div class=lbh><div class=lbg>${IC.globe}</div><p class=lbs>Search with Bing or type an address. Pages load through the Tuffs proxy.</p><div class=lbq>${QUICK.map(q=>`<button class=btn data-u="${esc(q[1])}">${esc(q[0])}</button>`).join('')}</div><p class=lbn>Simple sites work best. Logins, videos and heavy apps often don't load through this proxy.</p></div>
 <div class="lbh lbx" hidden></div><iframe class=lbi hidden allow="fullscreen;autoplay;clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-pointer-lock allow-presentation"></iframe></div>`;
 const fr=$('.lbi',b),home=$('.lbh',b),fail=$('.lbx',b),inp=$('input',b);let url='';
 const showFail=st=>{fr.hidden=true;fail.hidden=false;fail.innerHTML=b.failMsg?b.failMsg(url,st):`<b style="display:block;margin-bottom:8px">Couldn't load that page.</b><p class=lbs>The proxy couldn't open it. Some sites block proxies.</p>`};
 const nav=v=>{const u=parseAddr(v);if(!u)return;url=u;inp.value=u;home.hidden=true;fail.hidden=true;fr.hidden=false;const src=proxify(u);fr.src=src;
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);fetch(src,{signal:ctl.signal,method:'GET'}).then(r=>{clearTimeout(tm);if(!r.ok&&url===u)showFail(r.status)}).catch(()=>{clearTimeout(tm)})};
 fr.onload=()=>{try{const l=fr.contentWindow.location,real=unproxy(l.pathname);if(real){url=real+(/^https?%3A/i.test(l.pathname.slice(PROXY.length))&&real.indexOf('?')>=0?'':l.search);if(document.activeElement!==inp)inp.value=url}}catch(e){}};
 b.nav=nav;
 $('.lbf',b).onsubmit=e=>{e.preventDefault();inp.blur();nav(inp.value)};
 inp.onfocus=()=>inp.select();
 b.onclick=e=>{if(b.extra&&b.extra(e))return;const q=e.target.closest('[data-u]');if(q){nav(q.dataset.u);return}const t=e.target.closest('[data-b]');if(!t)return;const a=t.dataset.b;
  try{if(a=='back'){if(fr.hidden)return;fr.contentWindow.history.back()}else if(a=='fwd')fr.contentWindow.history.forward();else if(a=='re'){if(url)nav(url)}else if(a=='ext'){if(url)newTab(proxify(url))}}catch(_){}};
 setTimeout(()=>{if(innerWidth>700)inp.focus()},60)}

/* ---- Manga app: toonkotsu.com inside Lumio through the /service/ proxy ---- */
const MANGA='https://toonkotsu.com';
function lumioManga(b){lumioBrowser(b);
 b.failMsg=(u,st)=>`<div class=lbg>${IC.book}</div><b style="display:block;margin-bottom:8px">toonkotsu.com didn't load through the proxy.</b><p class=lbs>${st==403?'The site answered with Cloudflare\'s bot check (“Just a moment…”). That check can\'t be completed through the Tuffs proxy, so the reader can\'t open here.':'The proxy couldn\'t open it'+(st?' (error '+st+')':'')+'.'}</p><div class=lbq><button class=btn data-direct>Open toonkotsu.com in a new tab</button><button class=btn data-u="${MANGA}">Try again</button></div>`;
 b.extra=e=>{if(e.target.closest('[data-direct]')){newTab(MANGA);return true}return false};
 b.nav(MANGA)}
/* ---- Games app: the real Tuffs catalog (public/data/games.json + admin overrides from /api/games) ---- */
let CAT_P=null;
function loadCatalog(){if(CAT_P)return CAT_P;CAT_P=Promise.all([fetch('/data/games.json').then(r=>{if(!r.ok)throw new Error('games.json '+r.status);return r.json()}),fetch('/api/games').then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,o])=>{const ov=(o&&o.overrides)||{};const cu=((o&&o.custom)||[]).map(g=>({id:g.id,title:g.title,category:g.category,entry:g.url,external:true}));return (d.games||[]).concat(cu).filter(g=>g&&g.id&&!(ov[g.id]&&ov[g.id].hidden)).map(g=>({id:g.id,title:(ov[g.id]&&ov[g.id].title)||g.title||g.id,cat:g.category||'Games',url:g.external?g.entry:'/'+g.entry,ext:!!g.external,thumb:g.thumb?'/'+g.thumb:''})).sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true,sensitivity:'base'}))}).catch(e=>{CAT_P=null;throw e});return CAT_P}
function playGame(g){const k='game_'+g.id.replace(/[^\w-]/g,'_');if(!APPS[k])APPS[k]={n:g.title,i:IC.pad,w:860,h:560,hide:1,r(b){b.innerHTML=`<div class=lg2><div class=lgb><button class=btn data-fs>Full screen</button><button class=btn data-nt>Open in new tab</button></div><iframe allow="fullscreen;autoplay;gamepad" allowfullscreen></iframe></div>`;const f=$('iframe',b),src=g.ext?proxify(g.url):g.url;f.src=src;
 $('[data-fs]',b).onclick=()=>{const el=f;(el.requestFullscreen?el.requestFullscreen():Promise.reject()).catch(()=>{try{el.webkitEnterFullscreen&&el.webkitEnterFullscreen()}catch(e){}toast('Full screen is not supported here')})};$('[data-nt]',b).onclick=()=>newTab(new URL(src,location.href).href);
 b.closest('.win').onclose=()=>{f.src='about:blank'}}};open(k)}
function lumioGames(b){b.innerHTML=`<div class=lgw><div class=lgh><input type=search placeholder="Loading games…" aria-label="Search games" autocapitalize=none spellcheck=false><div class=lgc></div></div><div class=lgg><p class=lbs style="padding:20px;text-align:center">Loading games…</p></div></div>`;
 const q=$('input',b),cats=$('.lgc',b),grid=$('.lgg',b);let all=[],cat='All';
 const draw=()=>{const s=q.value.trim().toLowerCase(),l=all.filter(g=>(cat=='All'||g.cat==cat)&&(!s||g.title.toLowerCase().includes(s)||g.cat.toLowerCase().includes(s)));
  grid.innerHTML=l.length?l.map(g=>`<button class=gt data-g="${esc(g.id)}" title="${esc(g.title)}"><span class=gth>${g.thumb?`<img src="${esc(g.thumb)}" alt="" loading=lazy decoding=async onerror="this.remove()">`:''}<em>${esc(g.title.slice(0,1))}</em></span><b>${esc(g.title)}</b><small>${esc(g.cat)}</small></button>`).join(''):`<p class=lbs style="padding:20px;text-align:center">No games match “${esc(q.value)}”.</p>`};
 loadCatalog().then(l=>{all=l;q.placeholder=`Search ${l.length} games`;const cs=['All',...[...new Set(l.map(g=>g.cat))].sort()];cats.innerHTML=cs.map(c=>`<button class="btn ${c==cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');draw()}).catch(()=>{grid.innerHTML=`<p class=lbs style="padding:20px;text-align:center">Couldn't load the game list. Check your connection and reopen Games.</p>`});
 q.oninput=draw;
 cats.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){cats.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
 b.onclick=e=>{const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;cats.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===c));draw();return}const t=e.target.closest('[data-g]');if(t){const g=all.find(x=>x.id==t.dataset.g);if(g)playGame(g)}}}


/* Open a web address in the Lumio Browser app. */
function browseTo(u){open('browser');const w=open_['browser'];const body=w&&w.querySelector('.body');if(body&&body.nav)body.nav(u)}

/* ---- Lumio AI: chat UI for /api/ai/chat. Never invents replies. ---- */
/* Action tags from the server: [[open:game:<id>]] / [[open:app:<id>]]. Only real ids become buttons. */
const AI_APPS=['browser','games','ai','chat','manga','music','watch','account','settings','snake'];
let AI_CAT=null;function aiCatalog(){return loadCatalog().then(l=>{AI_CAT=l;return l}).catch(()=>null)}
function aiRun(k,id){if(k=='app'){if(AI_APPS.includes(id)&&APPS[id])open(id);return true}
 return aiCatalog().then(l=>{const g=l&&l.find(x=>x.id===id);if(g){playGame(g);return true}toast('That game isn\'t in the catalog');return false})}
const AI_SUGGEST=[['Find a game','Find me a fun racing game to play'],['Open 2048','Open 2048'],['Use the Browser','How do I use the Browser app to visit a website?'],['Study plan','Make me a 30-minute study plan for a math test tomorrow.']];
const AI_SUGGEST_ADMIN=[['Site stats','Show me the site stats'],['Announcement','Post an announcement: New games are coming this weekend!'],['Maintenance','Turn on maintenance mode'],['Propose code','Propose a code change that adds a public/hello.html page saying Hello from Lumio']];

 * Every page loads through the site's /service/ proxy. Tabs last for the browser session. ---- */
const ENGINES={brave:{n:'Brave Search',u:'https://search.brave.com/search?q='},bing:{n:'Bing',u:'https://www.bing.com/search?q='}};
const BRS={get(k,d){try{const v=JSON.parse(localStorage.getItem('lumio_br_'+k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('lumio_br_'+k,JSON.stringify(v))}catch(e){}}};
function brEngine(){const e=BRS.get('engine','brave');return ENGINES[e]?e:'brave'}
function brSearchUrl(q,eng){return ENGINES[eng||brEngine()].u+encodeURIComponent(q)}
function brParse(v){v=(v||'').trim();if(!v)return null;if(/^https?:\/\//i.test(v))return v;if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(v))return 'https://'+v;return brSearchUrl(v)}
function brHost(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}
function brFav(u){const h=brHost(u);return h?proxify('https://www.google.com/s2/favicons?domain='+encodeURIComponent(h)+'&sz=64'):''}
function brIsBraveSearch(u){return /^https:\/\/search\.brave\.com\/search\?/i.test(u||'')}
function brQuery(u){try{const x=new URL(u);if(/search\.brave\.com$|bing\.com$/.test(x.hostname))return x.searchParams.get('q')}catch(e){}return null}

 * Chat: the full Lumio Chat client lives at /chat/ (servers, channels, DMs,

 * Profiles: /api/profile, pictures from /api/avatar, uploads (GIF kept as-is)

 else if(file.size>cap||kind=='avatar'){body=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=async()=>{URL.revokeObjectURL(u);

   for(const q of [.9,.8,.65,.5]){const bl=await new Promise(r=>c.toBlob(r,'image/webp',q))||await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(bl&&bl.size<=cap)return res(bl)}rej(new Error('That picture is too big.'))};

const DOCK_ORDER=['browser','games','ai','chat','manga','music','watch','account','settings'];const vis=Object.keys(APPS).filter(k=>!APPS[k].hide).sort((a,b)=>(DOCK_ORDER.indexOf(a)+1||99)-(DOCK_ORDER.indexOf(b)+1||99));
$('#dock').innerHTML=vis.map(k=>`<button data-a=${k} data-n='${APPS[k].n}'>${APPS[k].i}</button>`).join('');
$('#dock').onpointermove=e=>{if(e.pointerType!='mouse')return;document.querySelectorAll('#dock button').forEach(b=>{const r=b.getBoundingClientRect(),d=Math.abs(e.clientX-(r.left+r.width/2));b.style.setProperty('--s',(1+.55*Math.exp(-(d*d)/6050)).toFixed(2))})};
$('#dock').onpointerleave=()=>document.querySelectorAll('#dock button').forEach(b=>b.style.removeProperty('--s'));
const GX=96,GY=104;
const defPos=i=>{const rows=Math.max(1,Math.floor((innerHeight-150)/GY));return [16+Math.floor(i/rows)*GX,46+(i%rows)*GY]};
const renderSide=()=>{$('#desk').innerHTML=st.desk.filter(k=>APPS[k]&&!APPS[k].hide).map((k,i)=>{const p=st.pos[k]||defPos(i);return `<button class=di data-a=${k} style='left:${p[0]}px;top:${p[1]}px'><i>${APPS[k].i}</i>${APPS[k].n}</button>`}).join('')};
let dg=null,dragged=0,lp,lpFired=0,sx=0,sy=0;
$('#desk').addEventListener('pointerdown',e=>{const t=e.target.closest('.di');if(t)dg={t,x:e.clientX,y:e.clientY,l:t.offsetLeft,tp:t.offsetTop,m:0}});
addEventListener('pointermove',e=>{if(!dg)return;const dx=e.clientX-dg.x,dy=e.clientY-dg.y;if(!dg.m&&Math.hypot(dx,dy)>8)dg.m=1;if(dg.m){dg.t.style.left=Math.max(0,Math.min(innerWidth-88,dg.l+dx))+'px';dg.t.style.top=Math.max(34,Math.min(innerHeight-90,dg.tp+dy))+'px'}});
addEventListener('pointerup',()=>{if(!dg)return;if(dg.m){const t=dg.t,l=Math.max(16,Math.round((t.offsetLeft-16)/GX)*GX+16),tp=Math.max(46,Math.round((t.offsetTop-46)/GY)*GY+46);t.style.left=l+'px';t.style.top=tp+'px';st.pos[t.dataset.a]=[l,tp];save();dragged=1;setTimeout(()=>dragged=0,60)}dg=null});
const cm=()=>document.querySelectorAll('.cm').forEach(m=>m.remove());
function menu(t,x,y){cm();const id=t.dataset.a,m=H(`<div class=cm><button data-o>Open ${APPS[id].n}</button><button data-h>${st.desk.includes(id)?'Remove from Desktop':'Add to Desktop'}</button></div>`);
m.style.left=Math.max(8,Math.min(x,innerWidth-210))+'px';m.style.top=Math.max(8,y>innerHeight/2?y-96:y)+'px';document.body.append(m);
$('[data-o]',m).onclick=()=>{cm();open(id)};$('[data-h]',m).onclick=()=>{cm();pin(id)}}
function pin(id){const had=st.desk.includes(id);st.desk=had?st.desk.filter(k=>k!=id):[...st.desk,id];save();renderSide();toast(st.chrome=='dock'&&!had?'Added. Set Chrome to Desktop in Settings to see it':APPS[id].n+(had?' removed from Desktop':' added to Desktop'))}
document.addEventListener('pointerdown',e=>{if(e.target.closest('.cm'))return;cm();lpFired=0;const t=e.target.closest('[data-a]');if(!t)return;sx=e.clientX;sy=e.clientY;clearTimeout(lp);lp=setTimeout(()=>{if(!dg||!dg.m){lpFired=1;menu(t,sx,sy)}},500)});
document.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>10)clearTimeout(lp)});
['pointerup','pointercancel'].forEach(v=>document.addEventListener(v,()=>clearTimeout(lp)));
document.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-a]');if(t){e.preventDefault();clearTimeout(lp);lpFired=1;menu(t,e.clientX,e.clientY)}});
const ACTS=[['Lock screen',()=>lockNow()],['Sign out',()=>signOut()],['Next wallpaper',()=>{const i=WALLS.findIndex(w=>w[0]==st.wall);st.wall=WALLS[(i+1)%WALLS.length][0];save();applyStyle()}],['Toggle desktop icons',()=>{st.chrome=st.chrome=='dock'?'desktop':'dock';save();applyStyle()}]];
function spR(q){q=q.toLowerCase();$('#spr').innerHTML=vis.filter(k=>APPS[k].n.toLowerCase().includes(q)).map(k=>`<button class=it data-sa=${k}>${APPS[k].i} ${APPS[k].n}</button>`).join('')+ACTS.map((x,i)=>x[0].toLowerCase().includes(q)?`<button class=it data-act=${i}>${IC.gear} ${x[0]}</button>`:'').join('')}
function spOpen(){if(!$('#lock').classList.contains('off'))return;$('#sp').classList.add('on');const i=$('#spq');i.value='';spR('');i.focus()}
$('#spq').oninput=e=>spR(e.target.value);
$('#sp').onclick=e=>{const t=e.target.closest('[data-sa],[data-act]');if(t){$('#sp').classList.remove('on');t.dataset.sa?open(t.dataset.sa):ACTS[+t.dataset.act][1]()}else if(e.target.id=='sp')$('#sp').classList.remove('on')};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();spOpen()}else if(e.key=='Escape'){$('#sp').classList.remove('on');$('#cc').classList.remove('on')}else if(e.key=='Enter'&&$('#sp').classList.contains('on')){const f=$('#spr .it');f&&f.click()}});
document.addEventListener('click',e=>{if(!e.target.closest('#cc,#bcc'))$('#cc').classList.remove('on');if(e.target.closest('[data-sp]')){spOpen();return}if(e.target.closest('#bcc')){$('#cc').classList.toggle('on');return}if(lpFired||dragged){lpFired=0;return}const t=e.target.closest('[data-a]');if(t)open(t.dataset.a)});

renderSide();applyStyle();tick();setInterval(tick,10000);
const route=()=>{const h=location.hash.slice(1);if(Object.keys(APPS).includes(h)&&!APPS[h].hide){if(AUTH.mode!='out'&&$('#lock').classList.contains('off'))open(h);else PENDING=h}};
route();addEventListener('hashchange',route);
bootAuth();
</script><script>
/* ===== Dock auto-hide =====
 * Mouse/trackpad: the dock slides away when the pointer leaves it and comes
 * back when the pointer touches the bottom edge (#dz) or the dock.
 * Touch: same, but a small pill (#dh) stays; tap it or swipe up from the
 * bottom edge to show the dock, and it hides a few seconds after the last
 * tap outside it. Settings → Desktop → "Auto-hide dock" turns it off. */
(()=>{
 if(st.dah==null){st.dah=1;save()}
 const D=$('#dock'),body=document.body;
 const dz=document.createElement('div');dz.id='dz';dz.setAttribute('aria-hidden','true');
 const dh=document.createElement('button');dh.id='dh';dh.type='button';dh.setAttribute('aria-label','Show dock');dh.innerHTML='<i></i>';
 body.append(dz,dh);
 let t=0;const coarse=matchMedia('(hover: none), (pointer: coarse)');
 const on=()=>!!st.dah;
 const busy=()=>!!document.querySelector('.cm')||D.matches(':hover')||D.contains(document.activeElement);
 const show=()=>{clearTimeout(t);D.classList.remove('hid');body.classList.remove('dhid')};
 const hide=()=>{clearTimeout(t);if(!on())return;if(busy()){later(800);return}D.classList.add('hid');body.classList.add('dhid');D.querySelectorAll('button').forEach(x=>x.style.removeProperty('--s'))};
 const later=ms=>{clearTimeout(t);if(on())t=setTimeout(hide,ms)};
 window.dockShow=show;window.dockHideSoon=later;
 const apply=()=>{body.classList.toggle('dah',on());body.classList.toggle('touchy',coarse.matches);if(on())later(1600);else show()};
 // mouse
 D.addEventListener('pointerenter',e=>{if(e.pointerType=='mouse')show()});
 D.addEventListener('pointerleave',e=>{if(e.pointerType=='mouse')later(700)});
 dz.addEventListener('pointerenter',e=>{if(e.pointerType=='mouse'||e.pointerType=='pen')show()});
 dz.addEventListener('pointerleave',e=>{if(e.pointerType=='mouse'&&!D.matches(':hover'))later(900)});
 // keyboard: tabbing into the dock shows it
 D.addEventListener('focusin',show);D.addEventListener('focusout',()=>later(1200));
 // touch
 dh.addEventListener('click',e=>{e.stopPropagation();show();later(5000)});
 document.addEventListener('pointerdown',e=>{if(!on()||e.pointerType=='mouse')return;if(D.contains(e.target)){clearTimeout(t);later(5000)}else if(!D.classList.contains('hid')&&e.target!==dh)later(2500)},true);
 let sy=null;
 addEventListener('touchstart',e=>{const y=e.touches[0].clientY;sy=on()&&y>innerHeight-36?y:null},{passive:true});
 addEventListener('touchmove',e=>{if(sy!=null&&sy-e.touches[0].clientY>24){sy=null;show();later(5000)}},{passive:true});
 // opening an app from the dock: get out of the way soon after
 D.addEventListener('click',()=>{if(on())later(coarse.matches?1500:1200)});
 // context menu from the dock keeps it up; re-check after it closes
 new MutationObserver(()=>{if(!document.querySelector('.cm')&&on()&&!D.matches(':hover'))later(1200)}).observe(body,{childList:true});
 coarse.addEventListener&&coarse.addEventListener('change',apply);
 // settings toggle
 const _ap=applyStyle;applyStyle=function(){_ap();apply()};
 // the lock screen covers everything; show the dock again right after unlocking so people see it
 new MutationObserver(()=>{if($('#lock').classList.contains('off')){show();later(2200)}}).observe($('#lock'),{attributes:true,attributeFilter:['class']});
 apply();
 // keyboard on phones: keep windows above it
 const vv=window.visualViewport;
 if(vv){const kb=()=>{const k=Math.max(0,innerHeight-vv.height-vv.offsetTop);document.documentElement.style.setProperty('--kb',k+'px');body.classList.toggle('kbd',k>80)};vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb);kb()}
})();

/* Password reset links (/#reset=...) from the Admin app. */
try{lumioReset()}catch(e){}

</script>
