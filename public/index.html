*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font:14px/1.4 'Segoe UI Variable','Segoe UI',system-ui,sans-serif;color:var(--txt);background:var(--wall)}button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.6}input{min-width:0}svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.mica{background:var(--mica);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--str)}
#desk{position:fixed;inset:0;z-index:0}#deskicons{position:absolute;inset:0;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:20px;pointer-events:none;z-index:1}
.dicon{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;width:92px;padding:8px;border-radius:8px;cursor:pointer;user-select:none}
.dicon:hover{background:var(--hov)}

function snd(kind){
  if(S&&S.sounds===false)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime,vol=(S&&S.volume!=null)?S.volume/100:.7,tone=(f,d,at,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+at);g.gain.linearRampToValueAtTime(v*vol,t+at+.012);g.gain.exponentialRampToValueAtTime(.0001,t+at+d);o.connect(g);g.connect(AC.destination);o.start(t+at);o.stop(t+at+d+.03)};
    if(kind==='click')tone(900,.05,0,.025);
    else if(kind==='open'){tone(440,.08,0,.04);tone(554,.1,.06,.04);tone(659,.16,.12,.03)}
    else if(kind==='close'){tone(523,.1,0,.035);tone(392,.14,.08,.03)}
    else if(kind==='notify'){tone(988,.12,0,.04);tone(1319,.2,.09,.04)}
    else if(kind==='chime'){[523,659,784,1047].forEach((f,n)=>tone(f,.45,n*.11,.05))}

  }catch(e){}
}

const uid=()=>Math.random().toString(36).slice(2,10);
function buildNotes(body){
  let notes=storage.get('notes',null);if(!Array.isArray(notes)||!notes.length)notes=[{id:uid(),title:'Welcome',text:'This is your notes app. Notes save automatically to this account.',ts:Date.now()}];
  let cur=notes[0].id,timer=0;
  body.innerHTML='<div class="nbar"><select class="nsel" aria-label="Choose note"></select><button class="btn nnew" type="button">New</button><button class="btn ndel" type="button">Delete</button></div><input class="addr ntitle" placeholder="Title" maxlength="80"><textarea class="ntext" placeholder="Write something…"></textarea><div class="mute nstat"></div>';
  const sel=body.querySelector('.nsel'),ti=body.querySelector('.ntitle'),tx=body.querySelector('.ntext'),st=body.querySelector('.nstat');
  const get=()=>notes.find(n=>n.id===cur);
  const persist=()=>{storage.set('notes',notes)};
  const stat=m=>{const w=(get().text.trim().match(/\S+/g)||[]).length;st.textContent=(m||'')+(m?'  ·  ':'')+w+' word'+(w===1?'':'s')};
  function fill(){sel.replaceChildren();for(const n of notes){const o=document.createElement('option');o.value=n.id;o.textContent=n.title||'Untitled';sel.append(o)}sel.value=cur;const n=get();ti.value=n.title;tx.value=n.text;stat('')}
  function save(){const n=get();n.title=ti.value;n.text=tx.value;n.ts=Date.now();persist();const o=[...sel.options].find(x=>x.value===cur);if(o)o.textContent=n.title||'Untitled';stat('Saved')}
  const later=()=>{stat('Saving…');clearTimeout(timer);timer=setTimeout(save,300)};
  ti.addEventListener('input',later);tx.addEventListener('input',later);
  sel.onchange=()=>{save();cur=sel.value;fill()};
  function add(){save();const n={id:uid(),title:'',text:'',ts:Date.now()};notes.unshift(n);cur=n.id;persist();fill();tx.focus()}
  body.querySelector('.nnew').onclick=add;

  fill();return{go(a){if(a==='new')add()}}
}

/* ---------- calculator ---------- */
function buildCalc(body){
  const host=document.createElement('div');host.className='calc';body.append(host);
  host.innerHTML='<div class="cdisp"><small></small><b>0</b></div><div class="ckeys"></div>';
  const small=host.querySelector('small'),big=host.querySelector('b'),keys=host.querySelector('.ckeys');
  let cur='0',prev=null,op=null,fresh=false;
  const fmt=v=>{if(!isFinite(v))return 'Error';let r=+v.toPrecision(12);return String(r)};
  const calc=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b;
  function draw(){big.textContent=cur;big.style.fontSize=cur.length>12?'28px':cur.length>8?'36px':'';small.textContent=op&&prev!==null?prev+' '+op:''}
  function press(k){
    if(cur==='Error'&&k!=='C'){cur='0'}
    if(/^\d$/.test(k)){if(fresh||cur==='0'){cur=k;fresh=false}else if(cur.replace(/[-.]/g,'').length<15)cur+=k}
    else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
    else if(k==='C'){cur='0';prev=null;op=null;fresh=false}
    else if(k==='⌫'){cur=fresh||cur.length<=1||(cur.length===2&&cur[0]==='-')?'0':cur.slice(0,-1)}
    else if(k==='±'){if(cur!=='0')cur=cur[0]==='-'?cur.slice(1):'-'+cur}
    else if(k==='%'){cur=fmt(parseFloat(cur)/100)}
    else if('+−×÷'.includes(k)){if(op&&!fresh&&prev!==null){const r=calc(parseFloat(prev),parseFloat(cur),op);cur=fmt(r);if(cur==='Error'){prev=null;op=null;draw();return}}prev=cur;op=k;fresh=true}
    else if(k==='='){if(op&&prev!==null){const r=calc(parseFloat(prev),parseFloat(cur),op);small.textContent=prev+' '+op+' '+cur+' =';cur=fmt(r);prev=null;op=null;fresh=true;big.textContent=cur;return}}
    draw()
  }
  for(const k of ['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','=']){const b=document.createElement('button');b.type='button';b.className='btn ck'+('÷×−+'.includes(k)?' op':k==='='?' eq':'');b.textContent=k;b.onclick=()=>press(k);keys.append(b)}
  const map={'*':'×','/':'÷','-':'−',Enter:'=','=':'=',Backspace:'⌫',Escape:'C',Delete:'C',',':'.'};
  function key(e){if(!host.isConnected){document.removeEventListener('keydown',key);return}if(focused!=='calc'||/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||''))return;const k=map[e.key]||e.key;if(/^[\d.+%]$/.test(k)||'×÷−=⌫C'.includes(k)&&k.length===1){e.preventDefault();press(k)}}
  document.addEventListener('keydown',key);draw()
}

/* ---------- clock (timer + stopwatch) ---------- */
function buildClock(body){
  const host=document.createElement('div');host.className='clk';body.append(host);
  host.innerHTML='<div class="seg cseg"><button type="button" class="on" data-t="timer">Timer</button><button type="button" data-t="watch">Stopwatch</button></div><div class="cpane"></div>';
  const pane=host.querySelector('.cpane'),segs=[...host.querySelectorAll('.cseg button')];
  const mk=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
  const pad=n=>String(n).padStart(2,'0');
  let timer={left:300000,end:0,run:false},watch={base:0,start:0,run:false,laps:[]},tick=0,tab='timer';
  const mmss=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(t/60))+':'+pad(t%60)};
  const wfmt=ms=>{const c=Math.floor(ms/10)%100,t=Math.floor(ms/1000);return pad(Math.floor(t/60))+':'+pad(t%60)+'.'+pad(c)};
  const wnow=()=>watch.base+(watch.run?Date.now()-watch.start:0);
  function loop(){if(!host.isConnected){clearInterval(tick);return}
    if(timer.run){timer.left=timer.end-Date.now();if(timer.left<=0){timer.run=false;timer.left=0;snd('alarm');toast('Timer finished');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}if(tab==='timer')render()}}
    const d=pane.querySelector('.ctime');if(d)d.textContent=tab==='timer'?mmss(timer.left):wfmt(wnow())}
  function render(){
    pane.replaceChildren();segs.forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
    if(tab==='timer'){
      const d=mk('div','ctime',mmss(timer.left));const presets=mk('div','cpre');
      for(const m of [1,5,10,25]){const b=mk('button','chip',m+' min');b.type='button';b.onclick=()=>{timer.run=false;timer.left=m*60000;render()};presets.append(b)}
      const row=mk('div','crow');const go=mk('button','btn p',timer.run?'Pause':'Start');go.type='button';go.onclick=()=>{if(timer.run){timer.left=timer.end-Date.now();timer.run=false}else{if(timer.left<=0)timer.left=300000;timer.end=Date.now()+timer.left;timer.run=true}render()};
      const rs=mk('button','btn','Reset');rs.type='button';rs.onclick=()=>{timer.run=false;timer.left=300000;render()};row.append(go,rs);pane.append(d,presets,row)
    }else{
      const d=mk('div','ctime',wfmt(wnow()));const row=mk('div','crow');
      const go=mk('button','btn p',watch.run?'Stop':'Start');go.type='button';go.onclick=()=>{if(watch.run){watch.base+=Date.now()-watch.start;watch.run=false}else{watch.start=Date.now();watch.run=true}render()};
      const lap=mk('button','btn','Lap');lap.type='button';lap.onclick=()=>{if(watch.run||watch.base){watch.laps.unshift(wnow());render()}};
      const rs=mk('button','btn','Reset');rs.type='button';rs.onclick=()=>{watch={base:0,start:0,run:false,laps:[]};render()};row.append(go,lap,rs);
      const list=mk('div','clap');watch.laps.forEach((l,n)=>{const r=mk('div','crowlap');r.append(mk('span','mute','Lap '+(watch.laps.length-n)),mk('span','',wfmt(l)));list.append(r)});pane.append(d,row,list)
    }
  }
  segs.forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  tick=setInterval(loop,100);render()
}

function buildTerminal(body){
  body.innerHTML='<div class="term" style="flex:1;background:#0c0c0c;color:#00ff00;font-family:monospace;padding:12px;overflow:auto;white-space:pre-wrap" id="tout"></div><form class="bar"><input class="addr" id="tin" placeholder="Command" autocomplete="off"><button class="btn p">Run</button></form>';
  const out=body.querySelector('#tout'),form=body.querySelector('form'),input=body.querySelector('#tin');
  const log=s=>{out.textContent+=s+'\n';out.scrollTop=out.scrollHeight};
  log('Lumio Terminal v1.1 — type help');
  let hist=[],hidx=0,cwd=['home'];
  const vfs=()=>storage.get('vfs',{home:{type:'dir',children:{}}});
  const getNode=p=>{let n=vfs();for(const s of p){if(!n[s]||n[s].type!=='dir')return null;n=n[s].children}return n};
  const cmds={
    help:()=>'Commands: help, clear, echo <text>, date, whoami, pwd, ls [path], cd <dir>, cat <file>, mkdir <name>, touch <name>, rm <name>, uptime, uname, history, calc <expr>, color <hex>',
    clear:()=>{out.textContent='';return ''},
    echo:a=>a.join(' '),
    date:()=>new Date().toLocaleString(),
    whoami:()=>USER,
    pwd:()=>'/'+cwd.join('/'),
    ls:a=>{const n=getNode(a[0]?cwd.concat(a[0].split('/').filter(Boolean)):cwd);if(!n)return 'no such directory';return Object.keys(n).map(k=>n[k].type==='dir'?k+'/':k).join('\n')||'(empty)'},
    cd:a=>{if(!a[0]||a[0]==='~'){cwd=['home'];return ''}const parts=a[0].split('/').filter(Boolean);let t=[...cwd];for(const p of parts){if(p==='..')t.pop();else t.push(p)}if(getNode(t)){cwd=t;return ''}return 'no such directory'},
    cat:a=>{if(!a[0])return 'usage: cat <file>';const parts=a[0].split('/'),name=parts.pop(),n=getNode(cwd.concat(parts));if(!n||!n[name]||n[name].type!=='file')return 'no such file';return n[name].content||''},
    mkdir:a=>{if(!a[0])return 'usage: mkdir <name>';const n=getNode(cwd);if(!n)return 'bad path';n[a[0]]={type:'dir',children:{}};storage.set('vfs',vfs());return ''},
    touch:a=>{if(!a[0])return 'usage: touch <name>';const n=getNode(cwd);if(!n)return 'bad path';n[a[0]]={type:'file',content:''};storage.set('vfs',vfs());return ''},
    rm:a=>{if(!a[0])return 'usage: rm <name>';const n=getNode(cwd);if(!n||!n[a[0]])return 'no such file';delete n[a[0]];storage.set('vfs',vfs());return ''},
    uptime:()=>'up '+Math.floor(performance.now()/1000)+'s',
    uname:()=>'Lumio 1.1 (browser) '+navigator.platform,
    history:()=>hist.join('\n')||'(empty)',
    calc:a=>{try{return String(Function('"use strict";return ('+a.join(' ')+')')())}catch(e){return 'bad expression'}},
    color:a=>{if(a[0])out.style.color=a[0];return 'color set'}
  };
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'){e.preventDefault();if(hidx>0){hidx--;input.value=hist[hidx]||''}}
    if(e.key==='Tab'){e.preventDefault();const parts=input.value.split(/\s+/);const last=parts.pop()||'';const n=getNode(cwd);if(n){const match=Object.keys(n).find(k=>k.startsWith(last));if(match){parts.push(match);input.value=parts.join(' ')}}}
    if(e.key==='ArrowDown'){e.preventDefault();if(hidx<hist.length){hidx++;input.value=hist[hidx]||''}}
  });
  form.onsubmit=e=>{
    e.preventDefault();
    const line=input.value.trim();if(!line)return;input.value='';hist.push(line);hidx=hist.length;
    log('> '+line);
    const [cmd,...args]=line.split(/\s+/);
    const fn=cmds[cmd];
    const res=fn?fn(args):'command not found: '+cmd;
    if(res)log(res);
  };
  return {}
}

    if(!host.isConnected||!running)return;
    cx.fillStyle='#0f172a';cx.fillRect(0,0,400,300);
    bricks.forEach(b=>{if(b.on){cx.fillStyle='hsl('+(b.x*2)+' 70% 50%)';cx.fillRect(b.x,b.y,b.w,b.h)}});
    cx.fillStyle='#fff';cx.fillRect(pad.x,280,pad.w,10);
    cx.beginPath();cx.arc(ball.x,ball.y,ball.r,0,7);cx.fill();
    ball.x+=ball.dx;ball.y+=ball.dy;
    if(ball.x<ball.r||ball.x>400-ball.r)ball.dx*=-1;
    if(ball.y<ball.r)ball.dy*=-1;
    if(ball.y>280-ball.r&&ball.x>pad.x&&ball.x<pad.x+pad.w)ball.dy*=-1;
    if(ball.y>300){lives--;ball={x:200,y:250,dx:3,dy:-3,r:6};if(lives<=0){running=false;sc.textContent='Game over  Score '+score}}
    bricks.forEach(b=>{if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.on=false;ball.dy*=-1;score+=10}});
    sc.textContent='Score '+score+'  Lives '+lives;
    requestAnimationFrame(loop);
  }
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect();pad.x=Math.max(0,Math.min(400-pad.w,(e.clientX-r.left)*(400/r.width)-pad.w/2))};
  loop();
}

<script>
/* Store uploaded images and GIFs as Blobs in IndexedDB, avoiding localStorage's small size limit. */
let customWallpaperURL=null;
let customWallpaperBlob=null;
let wallpaperRequest=0;
const wallpaperKey='haven_custom_wallpaper_v1';
function openWallpaperDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){reject(Error('IndexedDB unavailable'));return}
    const request=indexedDB.open('HavenWallpaperDB',1);
    request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('files'))request.result.createObjectStore('files')};
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}
async function wallpaperDB(action,blob){
  const db=await openWallpaperDB();
  try{
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction('files',action==='get'?'readonly':'readwrite');
      const store=tx.objectStore('files');
      const req=action==='get'?store.get('wallpaper:'+NS):action==='put'?store.put(blob,'wallpaper:'+NS):store.delete('wallpaper:'+NS);
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
      tx.onerror=()=>reject(tx.error);
    });
  }finally{db.close()}
}
function applyCustomWallpaper(){
  if(customWallpaperURL){
    document.documentElement.style.setProperty('--wall','url("'+customWallpaperURL+'")');
  }
  const preview=document.getElementById('custom-wallpaper-preview');
  if(preview){
    preview.style.backgroundImage=customWallpaperURL?'url("'+customWallpaperURL+'")':'var(--wall)';
  }
}
function showCustomWallpaper(blob){
  if(customWallpaperURL)URL.revokeObjectURL(customWallpaperURL);
  customWallpaperBlob=blob||null;
  customWallpaperURL=blob?URL.createObjectURL(blob):null;
  if(!blob){applyPrefs()}else{applyCustomWallpaper()}
}
async function restoreCustomWallpaper(){
  try{
    const blob=await wallpaperDB('get');
    if(blob instanceof Blob&&blob.size&&blob.type.startsWith('image/'))showCustomWallpaper(blob);
  }catch(e){
    /* Some private/file previews block IndexedDB; a new upload still previews for this session. */
    console.warn('Saved wallpaper unavailable:',e);
  }
}
function addWallpaperControls(body){
  const wallSelect=body.querySelector('#wall');
  if(!wallSelect)return;
  const row=wallSelect.closest('.row');
  if(!row)return;
  const wrap=document.createElement('div');
  wrap.innerHTML=`
    <h3>Custom wallpaper</h3>
    <div class="mute">Upload a photo or animated GIF from your device.</div>
    <div id="custom-wallpaper-preview" aria-label="Wallpaper preview"></div>
    <div id="custom-wallpaper-controls">
      <input id="custom-wallpaper-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" aria-label="Choose wallpaper image or GIF">
      <button type="button" class="btn" id="custom-wallpaper-reset">Restore default wallpaper</button>
      <div class="mute" id="custom-wallpaper-status" role="status"></div>
    </div>`;
  row.insertAdjacentElement('afterend',wrap);
  const file=wrap.querySelector('#custom-wallpaper-file');
  const status=wrap.querySelector('#custom-wallpaper-status');
  file.addEventListener('change',async()=>{
    const blob=file.files&&file.files[0];
    if(!blob)return;
    if(!['image/png','image/jpeg','image/webp','image/gif','image/avif'].includes(blob.type)){
      status.textContent='Choose a JPG, PNG, WebP, AVIF, or GIF.';return;
    }
    if(blob.size>40*1024*1024){status.textContent='Choose a file under 40 MB.';return}
    const token=++wallpaperRequest;
    showCustomWallpaper(blob);
    status.textContent='Wallpaper applied. Saving…';
    try{
      await wallpaperDB('put',blob);
      if(token===wallpaperRequest)status.textContent='Wallpaper saved, including animation for GIFs.';
    }catch(e){
      if(token===wallpaperRequest)status.textContent='Wallpaper applied for this session. This browser could not save it permanently.';
      console.warn('Wallpaper save failed:',e);
    }
  });
  wrap.querySelector('#custom-wallpaper-reset').addEventListener('click',async()=>{
    const token=++wallpaperRequest;
    showCustomWallpaper(null);
    file.value='';
    status.textContent='Default wallpaper restored.';
    try{await wallpaperDB('delete')}catch(e){console.warn('Could not delete saved wallpaper:',e)}
    if(token===wallpaperRequest)status.textContent='Default wallpaper restored.';
  });
  applyCustomWallpaper();
}
restoreCustomWallpaper();
</script>
