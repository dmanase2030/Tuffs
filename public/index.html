/* Hypr edition · fast, offline-first, compositor-inspired UI */

const CATALOG=[];let GOV={},catAdded=[];

function customWall(src){return {n:'Custom',s:'Your image or animated GIF',customSrc:src}}
function setWall(src){
 src=src.trim();
 if(!/^(https?:\/\/|data:image\/)/i.test(src)){toast('Use an image URL or upload a picture');return false}
 if(src.startsWith('data:')&&src.length>2600000){toast('Image is too large to save; choose a smaller image');return false}
 let persisted=true;
 try{localStorage.setItem('lx:cwall',JSON.stringify(src))}catch(e){persisted=false;st.set('cwall',src)}
 WALLS[4]=customWall(src);S.wall=4;saveS();applyS();
 toast(persisted?'Wallpaper updated':'Wallpaper applied for this session; storage is unavailable');return true
}
function pickWall(file){
 if(!file||!file.type.startsWith('image/'))return toast('Choose an image or GIF');
 if(file.type==='image/gif'){
  if(file.size>1900000)return toast('Choose a GIF under 1.9 MB to save it');
  const r=new FileReader();r.onload=()=>setWall(String(r.result));r.readAsDataURL(file);return;
 }
 if(file.size>14000000)return toast('Choose an image under 14 MB');
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement('canvas'),scale=Math.min(1,1600/im.width,1000/im.height);
  c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  setWall(c.toDataURL('image/jpeg',.79));
 };im.onerror=()=>toast('Could not open that image');im.src=String(r.result)};r.readAsDataURL(file)
}

    const items=fmLoad(),root=g.items.find(x=>x.name===g.name)||g.items[0];if(!root)return;

   }),appButton('Delete',()=>{if(!confirm('Permanently delete '+g.name+'?'))return;st.set('vftrash',fmSavedTrash().filter(y=>y.id!==g.id));draw()}));row.append(left,actions);list.append(row);
  });

for(let i=0;i<81;i++){const c=document.createElement("button");c.style.cssText=`aspect-ratio:1;border-radius:4px;font:700 13px system-ui,-apple-system,sans-serif;color:#4aa3ff;background:${r[i]?(m[i]?"#c52a3a":"#1b1b1e"):"#3a3a40"}`;c.textContent=r[i]?(m[i]?"x":cnt(i)||""):f[i]?"⚑":"";
const fl=()=>{if(!r[i]&&!over){f[i]^=1;draw()}};c.onclick=()=>{rev(i);draw()};c.oncontextmenu=e=>{e.preventDefault();fl()};let t;c.onpointerdown=()=>t=setTimeout(fl,500);c.onpointerup=()=>clearTimeout(t);bd.append(c)}};
const init=()=>{m=Array(81).fill(0);r=Array(81).fill(0);f=Array(81).fill(0);over=0;let k=0;while(k<10){const i=Math.floor(Math.random()*81);if(!m[i]){m[i]=1;k++}}draw()};st.onclick=()=>over&&init();init()}
function breakout(){const{w,body:b}=win("Breakout","",360,460);const c=document.createElement("canvas");c.width=320;c.height=400;c.style.cssText="background:#0c0c0e;margin:auto;max-width:100%;touch-action:none;display:block";b.append(c);const x=c.getContext("2d");
let px=130,bx,by,vx,vy,br;const rs=()=>{bx=160;by=300;vx=2.6;vy=-3.2;br=[];for(let r=0;r<5;r++)for(let k=0;k<8;k++)br.push([k*40+2,r*18+30,36,14,r])};rs();
const mvp=e=>{const R=c.getBoundingClientRect();px=Math.max(0,Math.min(260,(e.clientX-R.left)*320/R.width-30))};c.onpointermove=mvp;c.onpointerdown=mvp;
const kd=e=>{if(w.style.zIndex==z){if(e.key=="ArrowLeft")px=Math.max(0,px-24);if(e.key=="ArrowRight")px=Math.min(260,px+24)}};addEventListener("keydown",kd);const col=["#8ec9ff","#5aa9ff","#3584e4","#2f6db3","#26466b"];
const iv=setInterval(()=>{if(!w.isConnected){clearInterval(iv);removeEventListener("keydown",kd);return}
bx+=vx;by+=vy;if(bx<4||bx>316)vx=-vx;if(by<4)vy=-vy;if(by>380&&by<396&&bx>px&&bx<px+60&&vy>0){vy=-vy;vx=(bx-px-30)/9}if(by>410)rs();
br=br.filter(k=>{if(bx>k[0]&&bx<k[0]+k[2]&&by>k[1]&&by<k[1]+k[3]){vy=-vy;return false}return true});if(!br.length)rs();
x.fillStyle="#0c0c0e";x.fillRect(0,0,320,400);br.forEach(k=>{x.fillStyle=col[k[4]];x.fillRect(k[0],k[1],k[2],k[3])});x.fillStyle="#fff";x.fillRect(px,388,60,8);x.beginPath();x.arc(bx,by,5,0,7);x.fill()},16)}
</script>

<script>
(function(){
"use strict";
function $(q){return document.querySelector(q)}
/* ---- quick settings wiring ---- */
try{
 var qv=$('#qsvol'),qb=$('#qsbri');
 if(qv){qv.value=(S.vol==null?55:S.vol);qv.addEventListener('input',function(){S.vol=+qv.value;saveS();applyS()})}
 var tg=$('#qs .tg');
 if(tg){
  var dnd=null;[].forEach.call(tg.querySelectorAll('button'),function(b){if(b.textContent.trim()==='Do not disturb')dnd=b});
  if(dnd)dnd.classList.toggle('on',!!S.dnd);

  var sb=document.createElement('button');sb.type='button';
  function sLabel(){var p=PRESETS.filter(function(x){return x[0]===(S.preset||'hypr')})[0]||PRESETS[0];sb.textContent='Style: '+p[1]}
  sLabel();
  sb.addEventListener('click',function(){var i=PRESETS.map(function(x){return x[0]}).indexOf(S.preset||'hypr');var nx=PRESETS[(i+1)%PRESETS.length];S.preset=nx[0];S.accent=nx[2];saveS();applyS();sLabel();toast('Style: '+nx[1])});
  var wb=document.createElement('button');wb.type='button';wb.textContent='Next wallpaper';
  wb.addEventListener('click',function(){S.wall=(S.wall+1)%WALLS.length;saveS();applyS()});
  row.appendChild(sb);row.appendChild(wb);
  var lastTg=$('#qs').querySelectorAll('.tg');var anchor=lastTg[lastTg.length-1];
  anchor.parentNode.insertBefore(row,anchor);
 }
}catch(e){}
/* ---- dock auto-hide reveal + long-press labels ---- */
try{
 var dock=$('#dock'),zone=document.createElement('div');zone.id='dockzone';document.body.appendChild(zone);
 var lab=document.createElement('div');lab.id='docklab';document.body.appendChild(lab);
 function peek(on){if(dock)dock.classList.toggle('peek',on)}
 zone.addEventListener('mouseenter',function(){peek(true)});
 zone.addEventListener('touchstart',function(){peek(dock&&!dock.classList.contains('peek'))},{passive:true});
 if(dock){dock.addEventListener('mouseleave',function(){peek(false)})}
 var pressT=null,shownAt=0;
 dock.addEventListener('pointerdown',function(e){var b=e.target.closest('.ic');if(!b)return;pressT=setTimeout(function(){var r=b.getBoundingClientRect();lab.textContent=b.title||'';lab.style.left=(r.left+r.width/2)+'px';lab.style.top=(r.top-8)+'px';lab.style.display='block';shownAt=Date.now()},480)});
 ['pointerup','pointercancel','pointerleave'].forEach(function(ev){dock.addEventListener(ev,function(){clearTimeout(pressT);setTimeout(function(){lab.style.display='none'},60)})});
 dock.addEventListener('click',function(e){if(Date.now()-shownAt<700){e.stopPropagation();e.preventDefault();shownAt=0}},true);
}catch(e){}
/* ---- workspace overview ---- */
var selWin=null;
function renderWsov(){
 var ov=$('#wsov');if(!ov)return;var grid=ov.querySelector('.wsov-grid');grid.innerHTML='';
 for(var n=1;n<=WS_N;n++)(function(n){
  var wins=[].filter.call(document.querySelectorAll('.win'),function(w){return +w.dataset.ws===n});
  var card=document.createElement('div');card.className='wscard'+(n===WS?' cur':'');
  var h=document.createElement('b');h.textContent='Workspace '+n;card.appendChild(h);
  var sm=document.createElement('small');sm.textContent=wins.length?wins.length+' window'+(wins.length>1?'s':''):'empty';card.appendChild(sm);
  wins.forEach(function(w){
   var c=document.createElement('button');c.className='wschip'+(w===selWin?' sel':'');c.type='button';
   c.textContent=(w.dataset.app||'Window')+(w.dataset.min?' (minimized)':'');
   c.addEventListener('click',function(ev){ev.stopPropagation();selWin=(selWin===w?null:w);renderWsov()});
   card.appendChild(c);
  });
  card.addEventListener('click',function(){
   if(selWin&&+selWin.dataset.ws!==n){
    try{var old=+selWin.dataset.ws;removeFromTree(selWin);selWin.dataset.ws=String(n);if(!selWin.classList.contains('float')&&!selWin.dataset.min)insertWin(selWin);selWin.style.display=(n===WS&&!selWin.dataset.min)?'flex':'none';layoutWorkspace(old);layoutWorkspace(n);dockSync()}catch(e){}
    selWin=null;renderWsov();return;
   }
   closeWsov();setWS(n);
  });
  grid.appendChild(card);
 })(n);
}
function openWsov(){var ov=$('#wsov');if(!ov){ov=document.createElement('div');ov.id='wsov';ov.innerHTML='<div class="wsov-h"><span>Workspaces — tap a window, then a workspace to move it</span><button type="button">Done</button></div><div class="wsov-grid"></div>';document.body.appendChild(ov);ov.querySelector('.wsov-h button').addEventListener('click',closeWsov);ov.addEventListener('pointerdown',function(e){if(e.target===ov)closeWsov()})}selWin=null;renderWsov();ov.classList.add('on')}
function closeWsov(){var ov=$('#wsov');if(ov)ov.classList.remove('on')}
window.openWsov=openWsov;
/* ---- shortcut handling + rebind ---- */
function combo(e){var p=[];if(e.ctrlKey)p.push('ctrl');if(e.altKey)p.push('alt');if(e.shiftKey)p.push('shift');if(e.metaKey)p.push('meta');var k=e.key===' '?'space':(e.key||'').toLowerCase();if(['control','alt','shift','meta'].indexOf(k)>-1)return null;p.push(k);return p.join('+')}
function actFor(c){if(!c)return null;var K=S.keys||{};if(c===(K.term||'ctrl+alt+t')||c==='ctrl+alt+t')return 'term';if(c===(K.rofi||'alt+space')||c==='alt+space')return 'rofi';if(c===(K.wsov||'alt+o')||c==='alt+o')return 'wsov';return null}
window.addEventListener('keydown',function(e){
 if(window.__r3arming)return;
 var a=actFor(combo(e));if(!a)return;
 e.preventDefault();e.stopPropagation();
 try{
  if(a==='term')openApp(APPS.find(function(x){return x.n==='Terminal'}));
  else if(a==='rofi'){document.body.classList.contains('ov')?closeOv():openOv()}
  else if(a==='wsov'){var ov=$('#wsov');ov&&ov.classList.contains('on')?closeWsov():openWsov()}
 }catch(err){}
},true);
window.__rebind=function(btn,act){
 btn.textContent='Press keys…';window.__r3arming=true;
 var h=function(e){e.preventDefault();e.stopPropagation();var c=combo(e);window.__r3arming=false;if(!c){btn.textContent='Try again';return}if(!S.keys)S.keys={};S.keys[act]=c;saveS();btn.textContent=c.replace(/\+/g,' + ').replace(/\b\w/g,function(m){return m.toUpperCase()});toast('Shortcut set: '+btn.textContent)};
 window.addEventListener('keydown',h,{once:true,capture:true});
};
try{applyS()}catch(e){}
/* settings preview card */
function updPrev(){var pv=document.getElementById('setprev');if(!pv)return;try{
 var wall=document.getElementById('wall');
 var PN={hypr:'Hyprland',tokyo:'Tokyo Night',catppuccin:'Catppuccin',gruv:'Gruvbox',nord:'Nord',rose:'Rosé Pine',midnight:'Midnight'};
 pv.classList.toggle('bot',S.barPos==='bottom');
 pv.innerHTML='<div class="pv-desk"><div class="pv-wall"></div><div class="pv-bar"><span>1&nbsp;2&nbsp;3&nbsp;4&nbsp;5</span><span>TUFFS</span></div><div class="pv-win"><i></i></div><div class="pv-dock"><i></i><i></i><i></i><i></i></div></div><div class="pv-cap"></div>';
 var w=pv.querySelector('.pv-wall');if(wall){w.innerHTML=wall.innerHTML;w.style.backgroundImage=wall.style.backgroundImage;w.style.backgroundSize='cover';w.style.backgroundPosition='center';w.style.filter=wall.style.filter}
 pv.querySelector('.pv-cap').textContent=(PN[S.preset||'hypr']||'Hyprland')+' · '+((S.openMode||'tile')==='tile'?'Tiling':'Floating')+' · Bar '+(S.barPos||'top')+' · Gap '+(S.gap==null?10:S.gap)+'px · Accent '+S.accent;
}catch(e){}}
try{new MutationObserver(function(){updPrev()}).observe(document.documentElement,{attributes:true,attributeFilter:['style','data-preset','data-theme','data-barpos']});setInterval(updPrev,1600)}catch(e){}
})();
</script>
