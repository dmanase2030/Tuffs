<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Profile</title></head>
<body>
  <h1>Profile</h1>
  <form id="profile-form">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username"><br><br>
    <label for="profile-picture">Profile Picture:</label>
    <input type="file id=profile-picture" name="profile-picture" accept="image/*"><br><br>
    <label for="banner">Banner:</label>
    <input type="file" id="banner" name="banner accept=image/*"><br><br>
    <button id="save-profile-btn">Save Profile</button>
  </form>
  <div id="profile-preview">
    <img id="profile-picture-preview" src="">
    <img id="banner-preview" src="">
    <p id="username-preview"></p>
  </div>
  <script src="profile.js"></script>
</body>
</html>
