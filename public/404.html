<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Tuffs</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141417">
<style>
:root{--bg:#141417;--surface-2:#202027;--border-strong:rgba(255,255,255,.13);--text:#ececf0;--text-2:#a3a3ad;--accent:#8b5cf6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100dvh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:420px;text-align:center}
.code{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--text-2)}
h1{font-size:24px;margin:6px 0 8px}
p{color:var(--text-2);margin:0 0 22px}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none}
a:hover{filter:brightness(1.12)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
<div class="code">404</div>
<h1>Page not found</h1>
<p>That link doesn't go anywhere. It may have moved, or it was typed wrong.</p>
<a href="/">Back to Tuffs</a>
</main>
</body>
</html>
