<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1d1e23">
<title>Lumio Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%227%22 fill=%22%23f0a040%22/%3E%3Cpath d=%22M12 4c.4 3.4 1.8 5.4 7.5 8-5.7 2.6-7.1 4.6-7.5 8-.4-3.4-1.8-5.4-7.5-8 5.7-2.6 7.1-4.6 7.5-8z%22 fill=%22%231a1206%22/%3E%3C/svg%3E">
<style>
:root{--rail:#e3e5e8;--side:#f2f3f5;--main:#ffffff;--float:#ffffff;--input:#ebedef;--hov:rgba(6,6,7,.05);--sel:rgba(6,6,7,.09);--tx:#1e1f24;--hd:#060607;--mu:#5c5f69;--fa:#8a8e98;--line:rgba(6,6,7,.08);--ac:#e8901f;--ac2:#d27c0e;--on:#1a1206;--act:#a65800;--acs:rgba(232,144,31,.16);--dn:#e5484d;--ok:#2fa557;--wa:#e0a32e;--men:rgba(224,163,46,.12);--menl:#e0a32e;--sh:0 8px 28px rgba(0,0,0,.16);--ez:cubic-bezier(.2,.9,.3,1);--sp:cubic-bezier(.3,1.4,.5,1);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
:root[data-theme=dark]{--ac:#f0a040;--ac2:#f6b35e;--act:#f6b866;--acs:rgba(240,160,64,.16);--rail:#16171a;--side:#1e1f24;--main:#27282e;--float:#141518;--input:#33343b;--hov:rgba(255,255,255,.045);--sel:rgba(255,255,255,.09);--tx:#dfe1e6;--hd:#f4f5f7;--mu:#a0a3ad;--fa:#7b7e88;--line:rgba(255,255,255,.07);--men:rgba(224,163,46,.09);--sh:0 8px 28px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--rail);color:var(--tx);font:15px/1.375 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
input,textarea,select{font:inherit;color:var(--tx)}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hid{display:none!important}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
@keyframes fade{from{opacity:0}}
@keyframes flash{0%,60%{background:var(--acs)}}
@keyframes slideL{from{transform:translateX(100%)}}

/* layout */
#app{position:fixed;inset:0;display:flex;padding:var(--sat) var(--sar) 0 var(--sal);overflow:hidden}
#banner{position:fixed;left:0;right:0;top:0;z-index:70;background:var(--wa);color:#1b1300;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;padding:calc(4px + var(--sat)) 12px 4px;text-align:center}
#banner button{background:rgba(0,0,0,.18);border-radius:6px;padding:3px 9px;font-weight:700}
body.viewas #app{padding-top:calc(var(--sat) + var(--vb,30px))}
.rail{width:72px;flex:none;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 calc(12px + var(--sab));overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.side{width:240px;flex:none;background:var(--side);display:flex;flex-direction:column;min-width:0;border-radius:12px 0 0 0;overflow:hidden}
.main{flex:1;min-width:0;background:var(--main);display:flex;flex-direction:column;position:relative}
.mem{width:240px;flex:none;background:var(--side);overflow-y:auto;padding:8px 8px 20px;transition:margin .3s var(--ez)}
.app-memhide .mem{margin-right:-240px}

/* rail */
.si{position:relative;width:48px;height:48px;flex:none;display:grid;place-items:center}
.sbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;background:var(--main);transition:border-radius .25s var(--ez),background-color .2s,transform .12s;overflow:hidden;user-select:none}
.sbtn.g{color:var(--ok)}.sbtn.g:hover{background:var(--ok);color:#fff}
.si:hover .sbtn,.si.on .sbtn{border-radius:16px}.si .sbtn:active{transform:translateY(1px) scale(.96)}
.sbtn.home{background:var(--main);color:var(--tx)}.si.on .sbtn.home,.si:hover .sbtn.home{background:var(--ac);color:var(--on)}
.pill{position:absolute;left:-12px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:0 4px 4px 0;background:var(--hd);transform:scale(0);transition:transform .25s var(--sp),height .25s var(--ez),margin .25s var(--ez)}
.si.unread .pill{transform:scale(1)}.si:hover .pill{transform:scale(1);height:20px;margin-top:-10px}.si.on .pill{transform:scale(1);height:40px;margin-top:-20px}
.rsep{width:32px;height:2px;border-radius:1px;background:var(--line);flex:none}
.mbadge{position:absolute;right:-4px;bottom:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--dn);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:3px solid var(--rail)}
.tip{position:fixed;z-index:90;background:var(--float);color:var(--hd);font-weight:600;font-size:14px;padding:7px 11px;border-radius:7px;box-shadow:var(--sh);pointer-events:none;animation:pop .12s var(--ez);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}

/* sidebar */
.shead{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:700;color:var(--hd);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;transition:background-color .15s;min-width:0}
.shead:hover{background:var(--hov)}.shead span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.shead.nohov{cursor:default}.shead.nohov:hover{background:none}
.slist{flex:1;overflow-y:auto;padding:8px 8px 12px;overscroll-behavior:contain}
.cat{display:flex;align-items:center;gap:2px;margin:16px 0 2px;padding:0 4px 0 2px;font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--fa);cursor:pointer;user-select:none}
.cat:hover{color:var(--tx)}.cat .cn{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.cat svg.chv{transition:transform .2s var(--ez)}.cat.col svg.chv{transform:rotate(-90deg)}
.cat .cadd{opacity:0;color:var(--mu);padding:2px;border-radius:4px}.cat:hover .cadd,.touch .cat .cadd{opacity:1}.cat .cadd:hover{color:var(--hd)}
.slist>.cat:first-child{margin-top:4px}
.chn{position:relative;display:flex;align-items:center;gap:6px;width:100%;height:34px;padding:0 8px;margin:1px 0;border-radius:6px;color:var(--fa);font-weight:500;text-align:left;transition:background-color .12s,color .12s;user-select:none;-webkit-touch-callout:none}
.chn:hover{background:var(--hov);color:var(--tx)}.chn.on{background:var(--sel);color:var(--hd)}
.chn.unread{color:var(--hd);font-weight:650}.chn.unread::before{content:"";position:absolute;left:-8px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:0 4px 4px 0;background:var(--hd)}
.chn .hash{font-size:20px;line-height:1;width:20px;text-align:center;color:var(--fa);font-weight:400}
.chn .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chn .tools{display:none;gap:4px;color:var(--mu)}.chn:hover .tools,.chn.on .tools{display:flex}.chn .tools button:hover{color:var(--hd)}
.chn .mbadge{position:static;border:0;min-width:18px;height:18px;font-size:11px}
.chn.drop{box-shadow:inset 0 2px 0 var(--ac)}.cat.drop{color:var(--act)}
.dmrow{height:44px}.dmrow .av{width:32px;height:32px;font-size:13px}
.homebtn{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 10px;border-radius:6px;color:var(--mu);font-weight:600}
.homebtn:hover{background:var(--hov);color:var(--tx)}.homebtn.on{background:var(--sel);color:var(--hd)}
.sublbl{display:flex;align-items:center;justify-content:space-between;margin:18px 8px 4px;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--fa)}
.sublbl button:hover{color:var(--hd)}

/* user panel */
.upanel{flex:none;display:flex;align-items:center;gap:8px;padding:8px 8px calc(8px + var(--sab));background:color-mix(in srgb,var(--rail) 70%,var(--side))}
.uchip{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:4px;border-radius:8px;text-align:left}.uchip:hover{background:var(--hov)}
.uchip b{display:block;font-size:14px;color:var(--hd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.uchip small{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--mu);flex:none;transition:background-color .12s,color .12s}.ib:hover{background:var(--hov);color:var(--hd)}.ib.on{color:var(--hd)}

/* avatars */
.av{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none;user-select:none}
.av .st{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;border:3px solid var(--side);background:#80848e;box-sizing:content-box}
.st.online{background:var(--ok)!important}.st.idle{background:var(--wa)!important}.st.dnd{background:var(--dn)!important}.st.off{background:#80848e!important}
.av .st.idle::after{content:"";position:absolute;left:-12%;top:-12%;width:62%;height:62%;border-radius:50%;background:var(--side)}
.av .st.dnd::after{content:"";position:absolute;left:20%;right:20%;top:50%;height:22%;margin-top:-11%;border-radius:2px;background:var(--side)}
.av .st.off::after{content:"";position:absolute;inset:28%;border-radius:50%;background:var(--side)}

/* chat header */
.chead{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04);min-width:0}
.chead .ttl{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--hd);white-space:nowrap;min-width:0;flex:none;max-width:45%}
.chead .ttl span{overflow:hidden;text-overflow:ellipsis}
.chead .hash{font-size:22px;color:var(--fa);font-weight:400}
.chead .topic{flex:1;min-width:0;color:var(--mu);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px;margin-left:4px;border-left:1px solid var(--line)}
.chead .sp{flex:1}
.back{display:none}
.hsearch{width:150px;height:28px;border-radius:6px;background:var(--rail);border:0;padding:0 8px;font-size:13px;outline:0;transition:width .25s var(--ez)}.hsearch:focus{width:220px}

/* messages */
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 18px;overscroll-behavior:contain;display:flex;flex-direction:column}
.msgs>.fill{flex:1}.msgs>*{flex-shrink:0}
.wel{padding:24px 16px 8px}.wel .big{width:68px;height:68px;border-radius:50%;background:var(--input);display:grid;place-items:center;font-size:38px;color:var(--hd);margin-bottom:10px}
.wel h2{margin:0 0 6px;font-size:28px;color:var(--hd);line-height:1.2;word-break:break-word}.wel p{margin:0;color:var(--mu)}
.divd{display:flex;align-items:center;gap:8px;margin:18px 16px 4px;color:var(--fa);font-size:12px;font-weight:600}.divd::before,.divd::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{position:relative;padding:2px 48px 2px 72px;min-height:24px;transition:background-color .1s;-webkit-touch-callout:none}
.msg.head{margin-top:16px;padding-top:4px}
.msg:hover,.msg.ctx{background:var(--hov)}
.msg.new{animation:up .25s var(--ez)}
.msg.flash{animation:flash 1.6s ease}
.msg.mentioned{background:var(--men)}.msg.mentioned::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--menl)}
.msg>.av{position:absolute;left:16px;top:4px;cursor:pointer}
.msg.head.hasre>.av{top:26px}
.msg .hdr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.msg .nm{font-weight:600;color:var(--hd);cursor:pointer;word-break:break-word}.msg .nm:hover{text-decoration:underline}
.msg time,.htime{color:var(--fa);font-size:12px}
.htime{position:absolute;left:0;width:64px;text-align:right;top:5px;font-size:11px;opacity:0}.msg:hover .htime{opacity:1}
.txt{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;color:var(--tx)}
.txt code{background:var(--input);padding:1px 4px;border-radius:4px;font-size:.88em;font-family:ui-monospace,Menlo,Consolas,monospace}
.txt a{color:#3b8eea}
.edt{color:var(--fa);font-size:11px;margin-left:4px}
.mention{background:var(--acs);color:var(--act);font-weight:600;border-radius:4px;padding:0 2px;cursor:pointer}
:root[data-theme=dark] .mention{color:#c4b5ff}
.tag{background:var(--ac);color:var(--on);font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;align-self:center}
.tag.own{background:#f0a040;color:#2a1608}
.rref{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);margin:0 0 2px;position:relative;cursor:pointer;min-width:0}
.rref::before{content:"";position:absolute;left:-36px;top:9px;width:30px;height:10px;border:2px solid var(--fa);border-right:0;border-bottom:0;border-radius:6px 0 0 0;opacity:.6}
.rref .av{width:16px;height:16px;font-size:9px}.rref b{color:var(--hd);font-weight:600;white-space:nowrap}.rref span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rref:hover span{color:var(--tx)}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx button{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:8px;background:var(--input);border:1px solid transparent;font-size:14px;transition:transform .12s,border-color .15s}
.rx button b{font-size:13px;color:var(--mu);font-weight:600}.rx button.me{background:var(--acs);border-color:var(--act)}.rx button.me b{color:var(--act)}
.rx button:hover{border-color:var(--fa)}.rx button:active{transform:scale(.92)}
.rx button.pop{animation:pop .25s var(--sp)}
.mtools{position:absolute;right:14px;top:-16px;display:none;background:var(--main);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);overflow:hidden;z-index:2}
.msg:hover .mtools{display:flex}.touch .msg:hover .mtools{display:none}
.mtools button{width:32px;height:32px;display:grid;place-items:center;color:var(--mu)}.mtools button:hover{background:var(--hov);color:var(--hd)}.mtools button.dg:hover{color:var(--dn)}
.msg.sys{padding-top:6px;padding-bottom:6px;color:var(--mu);margin-top:4px}.msg.sys .txt{color:var(--mu);display:inline}.msg.sys time{margin-left:8px;white-space:nowrap}
.msg.sys .sarr{position:absolute;left:28px;top:9px;color:var(--ok)}
.einp{width:100%;background:var(--input);border:0;border-radius:8px;padding:9px 12px;outline:0;resize:none;margin:4px 0 2px;max-height:240px}
.ehint{font-size:12px;color:var(--mu)}.ehint button{color:#3b8eea}.ehint button:hover{text-decoration:underline}
.invc{background:var(--side);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:4px;max-width:420px}
.invc small{color:var(--mu);font-weight:700;font-size:12px;text-transform:uppercase}.invc .ir{display:flex;gap:12px;align-items:center;margin-top:8px}
.invc .sbtn{border-radius:14px;width:48px;height:48px}

/* composer */
.compw{flex:none;padding:0 16px calc(20px + var(--sab));position:relative}
.rbar{display:flex;align-items:center;gap:8px;background:var(--side);border-radius:8px 8px 0 0;padding:8px 12px;font-size:13px;color:var(--mu);animation:up .18s var(--ez)}
.rbar b{color:var(--hd)}.rbar span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rbar+.comp{border-radius:0 0 8px 8px}
.comp{display:flex;align-items:flex-end;gap:4px;background:var(--input);border-radius:8px;padding:0 6px;min-height:44px}
.comp textarea{flex:1;min-width:0;border:0;background:none;outline:0;resize:none;padding:11px 4px;max-height:40vh;line-height:22px;height:44px}
.comp .ib{width:36px;height:36px;margin:4px 0}
.comp .sendb{color:var(--act)}.comp .sendb:disabled{color:var(--fa);opacity:1}
.nosend{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:8px;background:var(--input);color:var(--mu);font-size:14px;padding:8px 12px;text-align:center}

/* member list */
.mgrp{margin:16px 8px 4px;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--fa);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgrp:first-child{margin-top:8px}
.mrow{display:flex;align-items:center;gap:10px;width:100%;padding:5px 8px;border-radius:6px;text-align:left;transition:background-color .12s;-webkit-touch-callout:none;user-select:none}
.mrow:hover{background:var(--hov)}.mrow.offl{opacity:.45}.mrow.offl:hover{opacity:1}
.mrow .av{width:32px;height:32px;font-size:13px}
.mrow .nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center;min-width:0}
.mrow .nm>span{overflow:hidden;text-overflow:ellipsis}
.mrow small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crown{color:var(--wa);flex:none}

/* floating stuff */
.ovl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;animation:fade .15s}
.dlg{width:100%;max-width:460px;max-height:min(86vh,720px);overflow-y:auto;background:var(--main);border-radius:12px;box-shadow:var(--sh);animation:pop .2s var(--ez);padding:20px}
.dlg h3{margin:0 0 6px;font-size:20px;color:var(--hd);text-align:center}.dlg .sub{color:var(--mu);text-align:center;margin:0 0 14px;font-size:14px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin:18px -20px -20px;padding:14px 20px;background:var(--side)}
.fl{display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--mu);margin:14px 0 6px;letter-spacing:.02em}
.fld{width:100%;background:var(--input);border:1px solid transparent;border-radius:6px;padding:10px;outline:0;transition:border-color .15s}.fld:focus{border-color:var(--act)}
textarea.fld{resize:vertical;min-height:80px}
.fld:disabled{opacity:.6;cursor:not-allowed}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:6px;background:var(--ac);color:var(--on);font-weight:600;font-size:14px;transition:background-color .15s,transform .1s;white-space:nowrap}
.b:hover{background:var(--ac2)}.b:active{transform:scale(.97)}.b.sec{background:var(--input);color:var(--tx)}.b.sec:hover{background:var(--sel)}
.b.dng{background:var(--dn)}.b.dng:hover{background:#c93a3f}.b.lnk{background:none;color:var(--tx)}.b.lnk:hover{text-decoration:underline}
.b.sm{height:30px;padding:0 12px;font-size:13px}.b.ok{background:var(--ok)}
.b.blk{width:100%}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--mu);font-size:13.5px;margin:10px 0}
.note.warn{border-color:rgba(224,163,46,.5);background:rgba(224,163,46,.08)}.note svg{margin-top:1px}
.ctx{position:fixed;z-index:80;min-width:200px;max-width:260px;background:var(--float);border-radius:8px;box-shadow:var(--sh);padding:6px;animation:pop .12s var(--ez);transform-origin:top left}
.ctx button,.ctx .mi{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:7px 8px;border-radius:4px;font-size:14px;font-weight:500;color:var(--tx);text-align:left}
.ctx button:hover:not(:disabled){background:var(--ac);color:var(--on)}.ctx button.dg{color:var(--dn)}.ctx button.dg:hover{background:var(--dn);color:#fff}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.ctx .qrx{display:flex;gap:4px;padding:2px 2px 6px}.ctx .qrx button{width:36px;height:36px;justify-content:center;padding:0;font-size:20px;background:var(--input);border-radius:50%}.ctx .qrx button:hover{background:var(--sel)}
.pop{position:fixed;z-index:75;width:300px;background:var(--float);border-radius:10px;box-shadow:var(--sh);overflow:hidden;animation:pop .16s var(--ez)}
.pop .bnr{height:60px}.pop .pav{margin:-38px 0 0 14px;width:84px;height:84px;font-size:30px;border:6px solid var(--float)}
