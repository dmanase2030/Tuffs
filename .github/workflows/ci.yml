name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check Pages Functions (ESM)
        run: |
          set -e
          for f in $(find functions -name '*.js' | sort); do
            tmp="/tmp/$(echo "$f" | tr '/' '_').mjs"
            cp "$f" "$tmp"
            node --check "$tmp"
            echo "ok: $f"
          done

      - name: Syntax-check the launcher client script
        run: node scripts/check-client.mjs

      - name: Validate the game catalog JSON
        run: node -e "const d=JSON.parse(require('fs').readFileSync('public/data/games.json','utf8')); console.log('games.json parses,', (d.games||d).length, 'entries')"

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Audit backend dependencies
        run: npm audit --audit-level=high

      # Not run: `npm run verify` / `npm test`. scripts/verify-catalog.js checks
      # the legacy Tuffs catalog schema (license info, local entry points);
      # the shipped catalog uses the newer format, so it fails by design until
      # the catalog is reconciled. See docs/upgrade-report.md.
